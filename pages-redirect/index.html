<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Floduler 주소가 바뀌었어요</title>
  <link rel="canonical" href="https://roomescapescheduler.web.app/" />
  <!-- 옛 주소(GitHub Pages /RoomEscapeScheduler/)로 들어온 사람을 새 주소(web.app)로 보낸다 — 경로·?·#(#e= 일정 링크, #s=·#z= 공유 링크)를 그대로 싣는다.
       북마크·홈 화면에 추가한 앱·카톡에 남은 옛 링크·옛 알림 링크가 모두 여기로 온다(2026-10-22). 404.html 도 같은 내용 -->
  <script>
    (function () {
      var base = '/RoomEscapeScheduler';
      var p = location.pathname;
      if (p.indexOf(base) === 0) p = p.slice(base.length);
      if (!p || p === '/index.html') p = '/';
      location.replace('https://roomescapescheduler.web.app' + p + location.search + location.hash);
    })();
  </script>
  <meta http-equiv="refresh" content="3;url=https://roomescapescheduler.web.app/" />
</head>

</body>
