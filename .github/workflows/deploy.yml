name: 테스트 후 배포

# main에 푸시될 때마다: 루트(index.html) 인수 테스트 + app/(React+TS) Vitest를
# 먼저 돌리고, 둘 다 통과해야 app/를 빌드해서 Firebase Hosting(roomescapescheduler.web.app)에 올린다.
# 테스트가 깨지면 배포 자체가 안 일어난다 — CI가 CD의 문을 지키는 구조.
# 2026-10-21 GitHub Pages(choieuihyun.github.io) 배포를 뺐다 — 주소에 GitHub 아이디가 보이지 않게(배포.md 5-1).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 배포 도중 또 push가 들어와도 새 배포가 끝난 뒤 처리한다 — 겹쳐서 올라가는 것 방지.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 루트 인수 테스트 (index.html의 @core 구간)
        run: npm test
      - name: app/ 테스트 (Vitest — core.ts/serialize.ts 이식분)
        working-directory: app
        run: |
          npm ci
          npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # web.app 은 도메인 루트라 APP_BASE=/ (app/vite.config.ts)
      - name: app/ 빌드
        working-directory: app
        env:
          APP_BASE: /
        run: |
          npm ci
          npm run build
      # firebase.json 은 호스팅만 정의한다 — firestore.rules 는 여기서 나가지 않는다(콘솔에서 게시, 배포.md §4).
      # 키는 `firebase init hosting:github` 이 저장소 Secrets 에 올린 서비스 계정이다.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROOMESCAPESCHEDULER }}
          projectId: roomescapescheduler
          channelId: live
