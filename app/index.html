<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- Firebase 가 함께 주는 두 번째 주소(firebaseapp.com)는 서버 CORS 허용 목록에 없어 로그인해도 모임 기능이 안 보인다 —
         그 주소로 들어오면 경로·?·#(#e= 일정, #s=·#z= 공유)를 그대로 싣고 web.app 으로 넘긴다(2026-10-22).
         /__/ 는 Firebase 가 쓰는 로그인 처리 경로라 건드리지 않는다 -->
    <script>
      if (location.hostname === 'roomescapescheduler.firebaseapp.com' && location.pathname.indexOf('/__/') !== 0)
        location.replace('https://roomescapescheduler.web.app' + location.pathname + location.search + location.hash);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Floduler</title>
    <meta name="description" content="방탈출 테마별 회차 시간을 넣으면 겹치지 않는 조합을 전부 계산해 주는 도구" />
    <!-- 검색에 안 나오게(§4.69). web.app 은 robots.txt 가 막지만 github.io 서브패스의 robots.txt 는
         크롤러가 안 읽어서 이 태그가 그쪽을 맡는다 -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- 앱 아이콘(2026-10-22) — Flo.D 로고(test/fixtures/플로디.png 에서 아이콘만 잘라 냄). 전에는 열쇠 이모지였다 -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- F-16 웹 푸시(iOS는 홈 화면 추가로 PWA 취급돼야 알림이 온다)를 위한
         최소 매니페스트. manifest.json은 base(§3 서브패스)를 따로 안 읽으므로
         start_url을 "."로 둬서 자기 위치 기준 상대경로로 풀리게 했다. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
    <meta name="theme-color" id="themeColorMeta" content="#F8F8F8" />
    <!-- 라이트·다크를 앱이 직접 칠한다고 브라우저에 알린다 — CSS 가 오기 전에도 크롬·삼성 인터넷의
         "웹페이지 자동 다크"가 먼저 덮어 칠하지 않게. 실제 값은 floduler.css 의 :root color-scheme 이 정한다 -->
    <meta name="color-scheme" content="light dark" />
    <script>
      // CSS 가 칠해지기 전에 저장된 테마를 먼저 붙인다 — 안 그러면 다크로 저장해 둔
      // 사람에게 밝은 화면이 잠깐 번쩍이고 어두워진다(FOUC). index.html과 동일한 가드.
      // 다크모드 토글 버튼 자체는 이번 단계 범위 밖이지만, 이 가드가 없으면 나중에
      // 토글을 붙였을 때 값이 있어도 번쩍이는 문제가 재현된다.
      try {
        const t = localStorage.getItem('resched.theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <!-- onnxruntime-web is marked external in vite.config.ts (see comment there) —
         this importmap is what lets the bare specifier resolve at runtime, same
         mechanism the original index.html uses. -->
    <script type="importmap">
      { "imports": { "onnxruntime-web": "%BASE_URL%vendor/onnxruntime-web/ort.wasm.min.mjs" } }
    </script>
    <!-- Firebase 접속 정보. 비밀이 아니다(firebase-config.js 상단 주석 참고) —
         저장소 루트의 사본과 내용이 같다. 비워 두면 로그인 기능만 조용히 꺼진다. -->
    <script src="/firebase-config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
