<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floduler</title>
<meta name="description" content="방탈출 테마별 회차 시간을 넣으면 겹치지 않는 조합을 전부 계산해 주는 도구">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🗝️</text></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<meta name="theme-color" id="themeColorMeta" content="#F2F4F6">
<script>
/* CSS 가 칠해지기 전에 저장된 테마를 먼저 붙인다 — 안 그러면 다크로 저장해 둔 사람에게
   밝은 화면이 잠깐 번쩍이고 어두워진다(FOUC). */
try{
  const t = localStorage.getItem('resched.theme');
  if(t) document.documentElement.setAttribute('data-theme', t);
}catch(e){}
</script>
<!-- PaddleOCR(ONNX) 을 번들러 없이 쓰기 위한 맨몸 지정자 매핑. 패키지 안의 상대경로
     import 는 vendor/ 아래 같은 폴더 구조를 그대로 옮겨 놨으므로 손대지 않아도 풀린다. -->
<script type="importmap">
{
  "imports": {
    "onnxruntime-web": "./vendor/onnxruntime-web/ort.wasm.min.mjs",
    "ppu-ocv/canvas-web": "./vendor/ppu-ocv/index.canvas-web.js",
    "ppu-paddle-ocr/web": "./vendor/ppu-paddle-ocr/web/index.js"
  }
}
</script>
<style>
/* ── 토큰 ──────────────────────────────────────────────
   밝은 배경 + 파란 포인트 + 큰 라운드 + 테두리 대신 그림자.
   색은 역할로만 부르고 값은 여기서만 정한다. */
:root{
  --bg:#F2F4F6;          /* 페이지 바닥 */
  --surface:#FFFFFF;     /* 카드 */
  --surface2:#F7F8FA;    /* 입력칸처럼 안으로 파인 면 */
  --line:#E8EBED; --line2:#D5DADF;

  --ink:#191F28;         /* 본문 */
  --ink2:#4E5968;        /* 보조 */
  --ink3:#626C7A;        /* 흐린 설명 */
  --placeholder:#98A2AE;

  /* --blue 는 흰 글자를 얹는 버튼·배지용, --blue-text 는 배경 위에 직접 얹는 글자용 —
     라이트 모드에선 같은 색이 두 역할 다 하지만, 다크 모드에선 방향이 갈린다(아래 참고). */
  --blue:#2670EB; --blue-hover:#1B64DA; --blue-press:#1B64DA; --blue-text:#2670EB;
  --blue-soft:#E8F3FF; --blue-line:#B6D8FF;
  --green:#00B26B; --green-text:#00734B; --green-soft:#E4F8EF;
  --red:#F04452;   --red-text:#D92B39;  --red-soft:#FFECEE;  --red-line:#FFC9CF;
  --amber:#E08700; --amber-text:#B4530A; --amber-soft:#FFF3E0; --amber-line:#FFD79A;

  /* 선택된 탭/정렬 칩처럼 "글자색을 뒤집어 채우는" 자리 전용 — --ink 와 분리해 둬야
     다크 모드에서 --ink 가 밝아져도 이 칩은 계속 또렷하게 채워진다. */
  --strong:#191F28; --strong-ink:#FFFFFF;

  /* 공백(잔여) 빗금 세 단계 — 기본/넓음/좁음 */
  --gap-a:#EDF0F3; --gap-b:#E1E6EB;
  --gap-big-a:#FFF3E0; --gap-big-b:#FFE3B8;
  --gap-tight-a:#FFECEE; --gap-tight-b:#FFD4D9;

  /* 이동 알약(채운 구간) */
  --mv-line:#E9A23B; --mv-fill:#FFC96B; --mv-text:#6B3D00;

  --r:16px; --r-sm:10px; --r-xs:8px; --pill:999px;
  --sh:0 1px 2px rgba(25,31,40,.04), 0 4px 16px rgba(25,31,40,.05);
  --sh-up:0 4px 12px rgba(25,31,40,.08), 0 12px 32px rgba(25,31,40,.08);
  --ring:0 0 0 3px rgba(49,130,246,.14);

  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,
         'Apple SD Gothic Neo','Segoe UI','Malgun Gothic',system-ui,sans-serif;
  --num:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace;
}

/* ── 다크 모드 ──────────────────────────────────────────
   같은 역할, 다른 값. 컴포넌트 CSS 는 전부 토큰만 참조하므로 여기 두 블록 밖은
   손댈 필요가 없다 — 시스템 설정을 따르는 경우([data-theme] 없음)와
   수동 토글([data-theme="dark"])을 한 값으로 같이 챙긴다. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161A; --surface:#1C1F26; --surface2:#242830;
    --line:#333A44; --line2:#4A5361;
    --ink:#F3F5F7; --ink2:#AEB6C2; --ink3:#7E8794; --placeholder:#828B98;

    --blue:#2E63D6; --blue-hover:#2454B8; --blue-press:#8FB4FF; --blue-text:#8FB4FF;
    --blue-soft:#172642; --blue-line:#3A5A90;
    --green:#22C57F; --green-text:#6FE3B0; --green-soft:#12301F;
    --red:#FF5D67;   --red-text:#FF9AA1;  --red-soft:#3A1418;  --red-line:#6B2830;
    --amber:#FFAE33; --amber-text:#FFCB70; --amber-soft:#3A2A0C; --amber-line:#6B4B14;

    --strong:#F3F5F7; --strong-ink:#14161A;

    --gap-a:#262B33; --gap-b:#2E343D;
    --gap-big-a:#3A2A0C; --gap-big-b:#4A3610;
    --gap-tight-a:#3A1418; --gap-tight-b:#4A1C22;

    --mv-line:#8C6427; --mv-fill:#4A340F; --mv-text:#FFCE85;

    --sh:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
    --sh-up:0 4px 14px rgba(0,0,0,.5), 0 16px 36px rgba(0,0,0,.5);
    --ring:0 0 0 3px rgba(91,147,255,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#14161A; --surface:#1C1F26; --surface2:#242830;
  --line:#333A44; --line2:#4A5361;
  --ink:#F3F5F7; --ink2:#AEB6C2; --ink3:#7E8794; --placeholder:#828B98;

  --blue:#2E63D6; --blue-hover:#2454B8; --blue-press:#8FB4FF; --blue-text:#8FB4FF;
  --blue-soft:#172642; --blue-line:#3A5A90;
  --green:#22C57F; --green-text:#6FE3B0; --green-soft:#12301F;
  --red:#FF5D67;   --red-text:#FF9AA1;  --red-soft:#3A1418;  --red-line:#6B2830;
  --amber:#FFAE33; --amber-text:#FFCB70; --amber-soft:#3A2A0C; --amber-line:#6B4B14;

  --strong:#F3F5F7; --strong-ink:#14161A;

  --gap-a:#262B33; --gap-b:#2E343D;
  --gap-big-a:#3A2A0C; --gap-big-b:#4A3610;
  --gap-tight-a:#3A1418; --gap-tight-b:#4A1C22;

  --mv-line:#8C6427; --mv-fill:#4A340F; --mv-text:#FFCE85;

  --sh:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
  --sh-up:0 4px 14px rgba(0,0,0,.5), 0 16px 36px rgba(0,0,0,.5);
  --ring:0 0 0 3px rgba(91,147,255,.28);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans);
  font-size:15px; line-height:1.6; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  padding:0 0 96px;
}
/* 숫자가 세로로 안 흔들리게. 시각은 표처럼 읽히는 게 맞다 */
.mono{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ── header ── */
header{padding:32px 0 26px}
h1{font-size:30px;font-weight:800;letter-spacing:-.035em;margin:0 0 8px;color:var(--ink)}
h1 .dim{color:var(--blue-text)}
header p{margin:0;color:var(--ink3);font-size:14px;max-width:52ch}

/* ── sections ── */
.sec{margin-bottom:34px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sec-head h2{font-size:18px;font-weight:700;letter-spacing:-.03em;color:var(--ink);margin:0}
.sec-head span{font-size:13px;color:var(--ink3)}
.sec-head .hi{color:var(--ink2);font-weight:600}
.sec-head .count{font-size:12.5px;color:var(--blue-press);font-weight:700;
  background:var(--blue-soft);border:none;border-radius:var(--pill);padding:3px 11px}

/* ── theme cards ── */
.themes{display:flex;flex-direction:column;gap:12px}
.addrow{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.addhint{font-size:12.5px;color:var(--ink3)}
.addhint b{color:var(--ink2);font-weight:600}
.card{background:var(--surface);border:1px solid transparent;border-radius:var(--r);
  padding:18px;box-shadow:var(--sh);transition:box-shadow .15s,border-color .15s}
.card.drag{border-color:var(--blue);background:var(--surface)}
.card-top{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}

input,textarea,select{
  background:var(--surface2);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--r-sm);padding:10px 12px;font-family:inherit;font-size:14px;
  transition:border-color .13s,box-shadow .13s,background .13s;
}
input::placeholder,textarea::placeholder{color:var(--placeholder)}
input:focus,textarea:focus,select:focus{outline:none;background:var(--surface);
  border-color:var(--blue);box-shadow:var(--ring)}
.i-name{flex:1;min-width:120px;font-weight:600}
.i-dur{width:84px;text-align:center}
.unit{color:var(--ink3);font-size:13px;margin-left:-2px}
textarea{width:100%;min-height:66px;resize:vertical;
  font-family:var(--num);font-variant-numeric:tabular-nums;font-size:13px;line-height:1.85}
.card-foot{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.btn-img{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);
  border:1px solid var(--line);color:var(--ink2);padding:7px 13px;font-size:13px;
  font-weight:500;border-radius:var(--r-sm);cursor:pointer}
.btn-img:hover{background:var(--line);border-color:var(--line2)}
.btn-img input{display:none}

/* 입력한 것이 어떻게 해석됐는지 바로 보여주는 줄.
   12시간 보정은 조용히 일어나면 사고가 되므로(순서가 섞이면 엉뚱한 값이 된다) 눈에 보이게 한다. */
.parsed{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.parsed .t{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:12px;
  font-weight:600;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);
  border-radius:var(--pill);padding:3px 10px}
.parsed .t.fix{background:var(--blue-soft);border-color:var(--blue-line);color:var(--blue-press)}
.parsed .t.so{background:var(--red-soft);border-color:var(--red-line);color:var(--red-text);
  text-decoration:line-through}
.parsed .t.over{background:var(--red-soft);border-color:var(--red-line);color:var(--red-text)}
.parsed .hint{font-size:12.5px;color:var(--ink3)}
.parsed .note{flex-basis:100%;font-size:12.5px;color:var(--ink3);margin-top:2px}
.parsed .warn{flex-basis:100%;font-size:13px;color:var(--red-text);margin-top:3px;line-height:1.55}
.parsed .warn b{color:var(--red-text);font-weight:700}
.chip{font-size:12.5px;color:var(--ink3)}
.chip .src{color:var(--ink3)}
.chip b{color:var(--ink);font-weight:700}
.chip i{color:var(--red-text);font-style:normal;font-weight:600}

/* ── buttons ── */
button{font-family:inherit;cursor:pointer;border-radius:var(--r-sm);transition:.13s;
  letter-spacing:-.01em}
.btn{background:var(--surface2);border:1px solid var(--line);color:var(--ink2);
  padding:9px 15px;font-size:13.5px;font-weight:500}
.btn:hover{background:var(--line);border-color:var(--line2);color:var(--ink)}
.btn-x{background:none;border:1px solid transparent;color:var(--ink3);padding:5px 9px;
  font-size:17px;line-height:1;border-radius:var(--r-xs)}
.btn-x:hover{color:var(--red);background:var(--red-soft)}
.btn-go{
  background:var(--blue);border:1px solid var(--blue);color:#fff;
  padding:13px 30px;font-size:15px;font-weight:700;border-radius:var(--r-sm);
  box-shadow:0 2px 8px rgba(49,130,246,.24);
}
.btn-go:hover{background:var(--blue-hover);border-color:var(--blue-hover);
  box-shadow:0 4px 14px rgba(49,130,246,.3)}
.btn-go:disabled{opacity:.4;cursor:default;box-shadow:none}

/* ── options ── */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 18px;
  background:var(--surface);border:none;border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.opt label{display:flex;align-items:center;font-size:12.5px;color:var(--ink3);
  letter-spacing:0;margin-bottom:6px;font-weight:500}
.opt input,.opt select{width:100%}
.checks{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px}
.mini{background:var(--blue-soft);border:none;color:var(--blue-press);font-size:11.5px;
  font-weight:600;padding:3px 9px;margin-left:7px;border-radius:var(--pill)}
.mini:hover{background:var(--blue-line)}
.mealrow{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;
  background:var(--surface);border:none;border-radius:var(--r);padding:14px 16px;
  font-size:13.5px;box-shadow:var(--sh)}
.mealrow.on{display:flex}
.mealrow input{width:82px;text-align:center}
.mealrow .lb{color:var(--ink2)}

/* 드래그 손잡이 겸 순서 번호. 잠그면 파란 알약이 되어 "이 자리" 임을 알린다 */
.idx{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;
  color:var(--ink3);width:26px;height:26px;flex:none;display:inline-flex;
  align-items:center;justify-content:center;border-radius:var(--pill);
  background:var(--surface2);cursor:grab;user-select:none}
.idx:active{cursor:grabbing}
.card.locked .idx{color:#fff;background:var(--blue)}
.card.dragging{opacity:.4}
.card.over{border-color:var(--blue);box-shadow:inset 0 3px 0 -1px var(--blue),var(--sh)}
.lockbtn{background:var(--surface2);border:1px solid var(--line);color:var(--ink3);
  font-size:12.5px;font-weight:500;padding:6px 11px}
.lockbtn:hover{background:var(--line);color:var(--ink2)}
.lockbtn.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn-copy{background:var(--surface2);border:1px solid var(--line);color:var(--ink2);
  font-size:12px;font-weight:500;padding:4px 11px;border-radius:var(--pill)}
.btn-copy:hover{background:var(--line);color:var(--ink)}
.res-head .btn-copy:first-of-type{margin-left:auto}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);
  cursor:pointer;font-weight:500}
.chk input{width:17px;height:17px;accent-color:var(--blue);cursor:pointer}
.run{display:flex;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}
.run .note{font-size:13px;color:var(--ink3)}

/* ── result tabs ── */
.tabrow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.tabrow.sets{margin-bottom:14px}
.tab{background:var(--surface);border:1px solid var(--line);color:var(--ink2);
  padding:7px 14px;font-size:13px;font-weight:500;border-radius:var(--pill)}
.tab b{color:var(--ink3);font-weight:700;margin-left:5px}
.tab:hover{border-color:var(--line2)}
.tab.on{background:var(--strong);border-color:var(--strong);color:var(--strong-ink);font-weight:600}
/* --strong-ink 자체가 테마마다 반대색(라이트=흰/다크=검)으로 뒤집히므로, 그 위에
   opacity 만 얹으면 다크 모드에서도 옅게 깔린다 — 예전엔 흰색을 박아 둬서 다크 모드에서
   밝은 알약 위에 거의 안 보였다. */
.tab.on b{color:var(--strong-ink);opacity:.62}
.tabrow.sets .tab{font-size:12.5px;padding:5px 12px}

/* ── sort ── */
.sorts{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.sortbtn{background:var(--surface);border:1px solid var(--line);color:var(--ink2);
  padding:7px 14px;font-size:13px;font-weight:500;border-radius:var(--pill)}
.sortbtn b{color:var(--ink3);font-weight:700;margin-left:5px}
.sortbtn:hover{border-color:var(--line2)}
.sortbtn.on{background:var(--strong);border-color:var(--strong);color:var(--strong-ink);font-weight:600}
.sortbtn.on b{color:var(--strong-ink);opacity:.62}

/* ── results ── */
.res{background:var(--surface);border:1px solid transparent;border-radius:var(--r);
  margin-bottom:12px;overflow:hidden;box-shadow:var(--sh)}
.res.best{border-color:var(--blue-line);box-shadow:0 0 0 1px var(--blue-line),0 6px 22px rgba(49,130,246,.12)}
.res-head{display:flex;align-items:center;gap:14px;padding:14px 18px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.rank{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:12.5px;
  font-weight:700;color:var(--ink3);width:auto;min-width:24px;flex:none}
.res.best .rank{color:var(--blue-press)}
.stat{font-size:13px;color:var(--ink3)}
.stat b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.stat.warn b{color:var(--red-text)}
.stat.good b{color:var(--green-text)}
.res-body{padding:18px}

/* 블록 폭은 소요시간에 비례해야 하므로 이름 길이로 늘릴 수 없다 (시간축이 거짓말이 된다).
   대신 타임라인 전체를 필요한 만큼 넓히고 가로로 스크롤한다 — 비율은 그대로, 이름은 다 들어간다. */
.tlwrap{overflow-x:auto;overflow-y:hidden;padding-bottom:2px}
.tlinner{min-width:100%}
.tlwrap::-webkit-scrollbar{height:7px}
.tlwrap::-webkit-scrollbar-thumb{background:var(--line2);border-radius:var(--pill)}

/* signature: timeline
   위: 테마 블록(이름 + 시작–종료)   아래: 공백 라벨   그 아래: 시간축 */
.tl{position:relative;height:74px;margin-bottom:6px}
.blk{position:absolute;top:0;height:50px;background:var(--blue-soft);
  border:1px solid var(--blue-line);border-radius:var(--r-xs);overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;padding:0 10px;gap:2px}
.blk .nm{overflow:hidden;white-space:nowrap}
.blk .nm i{display:inline-block;font-style:normal;font-size:13px;font-weight:700;
  color:var(--blue-press);letter-spacing:-.02em}
/* 이름이 블록보다 길면 잘라내지 않고 좌우로 천천히 훑는다 (--shift = 넘친 만큼) */
.blk .nm.roll i{animation:roll 6s ease-in-out infinite alternate}
@keyframes roll{from{transform:translateX(0)}to{transform:translateX(var(--shift,0))}}
.blk .rng{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:11px;
  font-weight:500;color:var(--ink2);white-space:nowrap;overflow:hidden;letter-spacing:-.02em}
.blk.so{border-style:dashed;border-color:var(--red-line);background:var(--red-soft)}
.blk.so .nm i{color:var(--red-text)}
.blk.so .rng{color:var(--red-text)}

<script>
/* ══ @core:start ══════════════════════════════════════════════════
   DOM에 의존하지 않는 순수 로직 구간.
   test/acceptance.mjs가 이 구간만 잘라내 그대로 실행하므로,
   여기에는 document/window를 참조하는 코드를 넣지 않는다.
   ════════════════════════════════════════════════════════════════ */

/* ── 시간 유틸 ── */
const pad = n => String(n).padStart(2,'0');
const fmt = m => pad(Math.floor(m/60)%24)+':'+pad(m%60);
function parseClock(s){
  const m = String(s||'').trim().match(/^(\d{1,2})\s*:\s*(\d{2})$/);
  if(!m) return null;
  const h=+m[1], mi=+m[2];
  if(h>29||mi>59) return null;
  return h*60+mi;
}

/* ── 회차 텍스트 파싱 ── */
/* "오전 10:30 매진 오후 12:00 매진 …" 또는 "10:30, 12:00, 1:30" 모두 처리 */
function parseSessions(text){
  const out=[];
  const toks = String(text||'').split(/[\s,·|\n\r\t]+/).filter(Boolean);
  let mer=null, sawMer=false;
  for(const tk of toks){
    if(/오전|AM/i.test(tk) && !/\d{1,2}:\d{2}/.test(tk)){ mer='am'; sawMer=true; continue; }
    if(/오후|PM/i.test(tk) && !/\d{1,2}:\d{2}/.test(tk)){ mer='pm'; sawMer=true; continue; }
    const hit = tk.match(/(오전|오후|AM|PM)?\s*(\d{1,2}):(\d{2})/i);
    if(hit){
      let lm = mer;
      if(hit[1]){ lm = /오전|AM/i.test(hit[1]) ? 'am':'pm'; sawMer=true; }
      let h=+hit[2], mi=+hit[3];
      if(lm==='pm' && h<12) h+=12;
      if(lm==='am' && h===12) h=0;
      out.push({t:h*60+mi, soldout:false});
      mer=null;
      continue;
    }
    if(/매진|마감|SOLD/i.test(tk) && out.length) out[out.length-1].soldout=true;
  }
  /* 1) 바로 옆에 같은 시각이 또 나오면 같은 칸을 두 번 읽은 것 → 접는다.
        떨어져 있는 같은 시각은 접으면 안 된다. 오전/오후가 한 바퀴 돈 것이기 때문:
        "10:30 12:00 … 9:00 10:30" 의 마지막 10:30 은 22:30 이다.
        (인접이냐 아니냐가 노이즈와 오후 한 바퀴를 가르는 기준) */
  const seq=[];
  for(const s of out){
    const prev=seq[seq.length-1];
    if(prev && prev.t===s.t){ prev.soldout = prev.soldout || s.soldout; continue; }
    seq.push(s);
  }
  /* 2) 오전/오후 표기가 전혀 없으면 오름차순 가정하고 12시간 보정.
        보정한 항목에는 표시를 남긴다 — 화면에서 "내가 친 것과 다르게 읽혔다" 를
        보여주기 위해서다. 이 보정은 순서가 뒤섞이면 엉뚱한 값을 만들므로 숨기면 안 된다. */
  if(!sawMer){
    for(let i=1;i<seq.length;i++){
      const before=seq[i].t;
      while(seq[i].t <= seq[i-1].t) seq[i].t += 12*60;
      if(seq[i].t!==before) seq[i].fixed=true;
    }
  }
  /* 3) 보정이 끝난 절대시각 기준으로 최종 중복 제거 */
  const byT=new Map();
  for(const s of seq){
    const prev=byT.get(s.t);
    if(prev){ prev.soldout = prev.soldout || s.soldout; continue; }
    byT.set(s.t,s);
  }
  return [...byT.values()].sort((a,b)=>a.t-b.t);
}
function sessionsToText(ss){
  return ss.map(s=>fmt(s.t)+(s.soldout?' 매진':'')).join('  ');
}

/* ── 조합 탐색 ── */
/* 폭주 방지용 상한. 요구 범위(테마 3~5개)는 상한에 걸리지 않고 전수 탐색된다 —
   테마 5개 / 회차 9~10개가 약 1.1만 조합, 10ms 수준.
   상한에 걸리면 결과 개수 옆에 "탐색 한도 도달"로 표시한다(조용히 자르지 않는다). */
const NODE_CAP=800000, KEEP_CAP=50000;
/* 매장 쌍의 키. 걷는 시간은 방향에 상관없으므로 정렬해서 한 칸만 쓴다
   (A↔B 를 두 번 적게 하면 입력만 두 배가 되고 서로 어긋날 여지가 생긴다). */
function pairKey(a,b){
  const x=(a||'').trim(), y=(b||'').trim();
  return x<y ? x+'\u0000'+y : y+'\u0000'+x;
}

/* 앞 테마에서 이 테마로 오는 데 드는 이동시간.
   쌍마다 적어둔 값이 있으면 그것을 쓰고, 없으면 기본값으로 떨어진다.
   매장을 적지 않은 테마는 "모른다" 이므로 0 으로 둔다 —
   모르는 것을 지어내면 조합이 조용히 사라진다. 빈칸은 제약이 아니어야 한다. */
function moveCost(fromPlace, toPlace, moveMin, moveMap){
  const a=(fromPlace||'').trim(), b=(toPlace||'').trim();
  if(!a || !b || a===b) return 0;
  if(moveMap){
    const v=moveMap[pairKey(a,b)];
    if(v!=null) return v;
  }
  return moveMin||0;
}

function search(list, o){
  const n=list.length, used=new Array(n).fill(false), path=[], out=[];
  let nodes=0, capped=false;
  function record(){
    /* 식사 공백: "공백을 줄여라" 가 아니라 "한 군데는 크게 비워라" 는 요구다.
       경로가 완성돼야 판정할 수 있으므로 가지치기가 아니라 여기서 거른다.
       창과 겹치는 길이로 따진다 — 11:00~13:00 공백은 11:30~14:00 창을 90분 채운다. */
    if(o.meal){
      let ok=false;
      for(let i=1;i<path.length;i++){
        const ov=Math.min(path[i].start,o.meal.to)-Math.max(path[i-1].end,o.meal.from);
        if(ov>=o.meal.min){ ok=true; break; }
      }
      if(!ok) return;
    }
    const gaps=[], waits=[];
    for(let i=1;i<path.length;i++){
      const g=path[i].start-path[i-1].end;
      gaps.push(g);
      waits.push(g-(path[i].move||0));   /* 이동을 뺀, 실제로 쉬는 시간 */
    }
    const total=gaps.reduce((a,b)=>a+b,0);
    const avg=gaps.length?total/gaps.length:0;
    const varc=gaps.length?Math.sqrt(gaps.reduce((a,g)=>a+(g-avg)**2,0)/gaps.length):0;
    out.push({
      steps:path.map(p=>({...p})), count:path.length,
      start:path[0].start, end:path[path.length-1].end,
      total, gaps, varc, minGap:gaps.length?Math.min(...gaps):Infinity,
      moveTotal: path.reduce((a,p)=>a+(p.move||0),0),
      minWait: waits.length?Math.min(...waits):Infinity
    });
  }
  function dfs(curEnd){
    if(out.length>=KEEP_CAP||nodes>NODE_CAP){capped=true;return;}
    if(path.length>=o.minCount) record();
    for(let i=0;i<n;i++){
      if(used[i])continue;
      const th=list[i];
      /* 자리를 잠근 테마는 그 자리에만 놓는다 (lockPos 는 0부터 센 순서).
         맨 앞만 잠그면 "첫 타 고정", 맨 뒤만 잠그면 "마지막 고정",
         전부 잠그면 "이 순서 그대로" 가 된다 — 개념 하나로 셋을 다 덮는다. */
      if(th.lockPos!=null && th.lockPos!==path.length) continue;
      for(const s of th.sessions){
        if(o.excludeSoldout&&s.soldout)continue;
        if(o.startMin!=null&&s.t<o.startMin)continue;
        /* 이동시간은 "후보를 줄이는" 제약이라 가지치기로 처리한다 (식사 공백과 반대다).
           최소 공백 위에 얹는다 — 최소 공백은 정리·여유이고 이동은 그 위의 실제 소요다. */
        const move = path.length ? moveCost(path[path.length-1].place, th.place, o.moveMin, o.moveMap) : 0;
        if(path.length){
          const g=s.t-curEnd;
          if(g < o.minGap + move) continue;
          if(o.maxGap!=null&&g>o.maxGap)continue;
        }
        const end=s.t+th.dur;
        if(o.endMax!=null&&end>o.endMax)continue;
        nodes++;
        used[i]=true; path.push({i,name:th.name||('테마 '+(i+1)),place:th.place||'',dur:th.dur,
                                 start:s.t,end,soldout:s.soldout,move});
        dfs(end);
        path.pop(); used[i]=false;
        if(nodes>NODE_CAP){capped=true;return;}
      }
    }
  }
  dfs(null);
  return {out,capped};
}

/* ── 정렬 ── */
const SORTS=[
  {k:'gap',   label:'공백 적은 순',  f:(a,b)=>b.count-a.count||a.total-b.total||a.end-b.end},
  {k:'end',   label:'빨리 끝나는 순',f:(a,b)=>b.count-a.count||a.end-b.end||a.total-b.total},
  {k:'even',  label:'공백 고른 순',  f:(a,b)=>b.count-a.count||a.varc-b.varc||a.total-b.total},
  {k:'late',  label:'늦게 시작 순',  f:(a,b)=>b.count-a.count||b.start-a.start||a.total-b.total},
  {k:'safe',  label:'여유 있는 순',  f:(a,b)=>b.count-a.count||b.minGap-a.minGap||a.total-b.total},
];

/* ── 상태 ── */
let themes=[], nextId=1;
function blank(name){ return {id:nextId++, name:name||'', place:'', dur:70, raw:'', sessions:[], busy:'', err:'', source:'', lock:false, imgCount:0, mergeMode:true}; }

/* '테스트 데이터 넣기' 버튼을 누르면 채워지는 예시 데이터. 시작할 때는 빈 화면이다 —
   눌러본 적 없는 사람에게 낯선 매장 이름을 먼저 보여줄 이유가 없다. */
const SEED=[
  ['범계',      75, '10:30  12:00  13:30  15:00  16:30  18:00  19:30  21:00  22:30', ''],
  ['몽',        70, '10:50  12:10  13:30  14:50  16:10  17:30  18:50  20:10  21:30  22:50', ''],
  ['왓 어 트립', 70, '10:20  11:45  13:10  14:35  16:00  17:25  18:50  20:15  21:40  23:05', ''],
];
function seed(){
  return SEED.map(([name,dur,raw,place])=>{
    const th=blank(name); th.dur=dur; th.raw=raw; th.place=place||'';
    th.sessions=parseSessions(raw); th.source='manual';
    return th;
  });
}
themes = [];

/* ── 테마 렌더 ── */
const elThemes = document.getElementById('themes');
const DRAG_TYPE='application/x-theme-index';
function renderThemes(){
  elThemes.innerHTML='';
  /* "3연방" 처럼 지금 몇 개를 짜고 있는지 헤더에 띄운다.
     추가·삭제가 가능하다는 사실 자체가 잘 안 보였다. */
  const n=themes.length;
  document.getElementById('themeCount').textContent = n>=2 ? n+'연방' : n+'개';
  if(!n){
    elThemes.innerHTML='<div class="empty">테마가 없습니다. 아래 ＋ 테마 추가를 눌러 주세요.</div>';
    return;
  }
  themes.forEach((th,i)=>{
    const c=document.createElement('div');
    c.className='card'+(th.lock?' locked':'');
    c.innerHTML=`
      <div class="card-top">
        <span class="idx">${pad(i+1)}</span>
        <input class="i-name" placeholder="테마 이름" value="${esc(th.name)}" data-k="name">
        <input class="i-dur mono" value="${th.dur}" data-k="dur" inputmode="numeric">
        <span class="unit">분</span>
        <button class="lockbtn${th.lock?' on':''}" data-k="lock" type="button"
          title="이 카드를 지금 자리에 고정합니다. 잠그지 않은 카드는 도구가 알아서 배치합니다">${th.lock?'자리 고정됨':'자리 고정'}</button>
        <button class="btn-x" data-k="del" title="삭제">×</button>
      </div>
      <div class="placerow">
        <span class="plb">매장</span>
        <input class="i-place" placeholder="비워두면 이동시간을 안 붙입니다" value="${esc(th.place)}" data-k="place"
          title="같은 매장끼리는 이동시간이 0 입니다. 매장이 다르면 조건의 이동시간이 붙습니다">
      </div>
      <textarea data-k="raw" placeholder="10:00  13:10  15:40  17:20  ← 예약 가능한 회차만 (쉼표·줄바꿈도 됨)&#10;또는 예약 화면 캡처를 붙여넣기 (Ctrl+V)">${esc(th.raw)}</textarea>
      <div class="parsed">${parsedHTML(th)}</div>
      <div class="card-foot">
        <label class="btn-img">${th.source.startsWith('image')&&th.sessions.length?'이미지 추가':'이미지 첨부'}<input type="file" accept="image/*" multiple data-k="file"></label>
        <label class="chk mini" title="켜두면 새 이미지가 있던 회차에 이어 붙습니다. 꺼두면 새 이미지가 있던 값을 지우고 대신합니다">
          <input type="checkbox" data-k="merge"${th.mergeMode!==false?' checked':''}> 이미지 여러장 넣기
        </label>
        <span class="chip">${chipHTML(th)}</span>
        <span class="busy">${th.busy?esc(th.busy):''}</span>
        <span class="err">${th.err?esc(th.err):''}</span>
      </div>`;
    c.querySelector('[data-k=name]').oninput = e => th.name=e.target.value;
    c.querySelector('[data-k=place]').oninput = e => { th.place=e.target.value; renderPairs(); refreshMoveHint(); };
    c.querySelector('[data-k=merge]').onchange = e => { th.mergeMode = e.target.checked; };
    c.querySelector('[data-k=dur]').oninput  = e => th.dur=Math.max(1,parseInt(e.target.value)||0);
    c.querySelector('[data-k=lock]').onclick = ()=>{ th.lock=!th.lock; renderThemes(); };
    c.querySelector('[data-k=del]').onclick  = ()=>{ themes=themes.filter(x=>x!==th); renderThemes(); renderPairs(); refreshMoveHint(); };
    const ta=c.querySelector('[data-k=raw]');
    ta.oninput = e => {
      th.raw=e.target.value;
      th.sessions=parseSessions(th.raw);
      th.source = th.source.startsWith('image') ? 'image-edited' : 'manual';
      th.err='';
      refreshFoot(c,th);
    };
    ta.onpaste = e => handlePaste(e, th);
    /* 모바일·윈도우용 첨부 경로. 폰에서는 앨범/카메라가 열린다.
       같은 파일을 다시 골라도 change 가 뜨도록 value 를 비운다. */
    c.querySelector('[data-k=file]').onchange = async e => {
      const files=[...(e.target.files||[])];
      e.target.value = '';
      if(files.length) clearIfOverwrite(th);
      /* 시간표가 길어 캡처를 두 장 이상 나눠 넣는 경우 — 차례로 읽어 이어 붙인다.
         워커가 하나뿐이라 동시에 돌리면 서로의 진행 표시를 덮어쓴다. */
      for(const f of files) await readImage(f, th);
    };
    /* 번호를 잡고 끌면 카드 순서가 바뀐다. 이미지 드롭과 섞이지 않도록
       전용 타입으로 구분한다 — dragover 에서는 getData 를 못 읽지만 types 는 읽을 수 있다. */
    const handle=c.querySelector('.idx');
    handle.draggable=true;
    handle.ondragstart = e => {
      e.dataTransfer.setData(DRAG_TYPE, String(i));
      e.dataTransfer.effectAllowed='move';
      c.classList.add('dragging');
    };
    handle.ondragend = ()=>{
      c.classList.remove('dragging');
      elThemes.querySelectorAll('.card').forEach(x=>x.classList.remove('over'));
    };
    c.addEventListener('dragover', e=>{
      e.preventDefault();
      c.classList.add([...e.dataTransfer.types].includes(DRAG_TYPE) ? 'over' : 'drag');
    });
    c.addEventListener('dragleave',()=>{ c.classList.remove('drag'); c.classList.remove('over'); });
    c.addEventListener('drop', e=>{
      e.preventDefault(); c.classList.remove('drag'); c.classList.remove('over');
      if([...e.dataTransfer.types].includes(DRAG_TYPE)){
        const from=+e.dataTransfer.getData(DRAG_TYPE);
        if(!Number.isNaN(from) && from!==i){
          const [moved]=themes.splice(from,1);
          themes.splice(i,0,moved);
          renderThemes();
        }
        return;
      }
      const fs=[...(e.dataTransfer.files||[])].filter(f=>f.type.startsWith('image/'));
      if(fs.length) clearIfOverwrite(th);
      (async()=>{ for(const f of fs) await readImage(f, th); })();
    });
    elThemes.appendChild(c);
  });
  scheduleAutosave();
}
/* 자정을 넘긴 값은 fmt 가 24로 나눈 나머지를 주므로 25:10 이 01:10 로 보인다.
   그대로 두면 "왜 새벽 1시가 있지?" 가 되므로 넘김을 밝혀서 표시한다. */
function fmtDay(t){ return t>=24*60 ? '다음날 '+fmt(t) : fmt(t); }

function chipHTML(th){
  const avail=th.sessions.filter(s=>!s.soldout).length;
  const sold=th.sessions.length-avail;
  const src = th.source==='image'
            ? (th.imgCount>1 ? `사진 ${th.imgCount}장에서 읽음` : '사진에서 읽음')
            : th.source==='image-edited' ? '사진 → 수정함'
            : th.sessions.length ? '직접 입력' : '';
  const cnt = th.sessions.length ? `회차 <b>${avail}</b>${sold?` · 매진 <i>${sold}</i>`:''} ` : '회차 없음';
  return (src ? `<span class="src">${esc(src)}</span> · ` : '') + cnt;
}
/* 입력한 것이 어떻게 해석됐는지 그대로 보여준다. 계산을 누르기 전에 확인할 수 있어야 한다. */
function parsedHTML(th){
  if(!th.sessions.length)
    return '<span class="hint">시간을 넣으면 해석 결과가 여기 표시됩니다</span>';
  const over = th.sessions.some(s=>s.t>=24*60);
  const fixed = th.sessions.some(s=>s.fixed);
  const sold = th.sessions.filter(s=>s.soldout).length;
  let out = th.sessions.map(s=>{
    const cls = 't' + (s.t>=24*60?' over':'') + (s.fixed?' fix':'') + (s.soldout?' so':'');
    const tip = s.fixed ? ' title="오전/오후 표기가 없어 12시간 보정된 값입니다"' : '';
    return `<span class="${cls}"${tip}>${fmtDay(s.t)}${s.soldout?' 매진':''}</span>`;
  }).join('');
  if(sold) out += `<span class="note">매진으로 읽힌 ${sold}개는 계산에서 제외됩니다</span>`;
  if(over) out += `<span class="warn">자정을 넘긴 회차가 있습니다. 이른 시간부터 순서대로 넣었는지 확인해 주세요 — 순서가 섞였다면 <b>오전</b>/<b>오후</b>를 붙이면 순서와 무관하게 정확해집니다.</span>`;
  else if(fixed) out += `<span class="note">파란색은 12시간 보정된 값입니다 (예: 1:10 → 13:10)</span>`;
  /* 사진에서 온 값은 인식이 틀렸을 수 있다 — 잘못 읽혔어도 계산은 아무 저항 없이 돌아간다
     (형식만 맞으면 존재하지 않는 회차도 똑같이 시각 하나일 뿐이다). 그래서 항상 한 번은
     사람이 보게 만든다. 손으로 고치고 나면(source가 image-edited 로 바뀌어도) 여전히
     이미지에서 온 값이 섞여 있을 수 있으므로 계속 띄운다. */
  if(th.source.startsWith('image'))
    out += `<span class="warn">사진에서 읽은 값입니다 — 시간이 제대로 맞는지 한 번 확인해 주세요. 인식이 부정확할 수 있습니다.</span>`;
  return out;
}

/* 카드 하단을 다시 그린다.
   에러 칸을 빼먹으면 사용자가 직접 입력해 문제를 해결한 뒤에도 옛 에러 문구가 남아
   "아직 안 됐나?" 로 읽힌다. */
function refreshFoot(card, th){
  card.querySelector('.chip').innerHTML = chipHTML(th);
  card.querySelector('.parsed').innerHTML = parsedHTML(th);
  card.querySelector('.err').textContent = th.err || '';
}
function esc(s){ return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
document.getElementById('addTheme').onclick=()=>{ themes.push(blank('')); renderThemes(); renderPairs(); refreshMoveHint(); };
document.getElementById('seedBtn').onclick=()=>{

  renderThemes();
};

/* ── 사용법 투어 ──
   화면을 어둡게 덮고 설명할 요소 하나만 구멍을 뚫어 보여주는 스포트라이트 방식.

const TOUR_KEY='resched.tour_v1';
const TOUR_STEPS=[
  {sel:'#seedBtn',  title:'감이 안 잡히면',   body:'예시 데이터를 넣어보고 화면이 어떻게 채워지는지 먼저 확인해 보세요. 지우고 다시 시작해도 됩니다.'},
  {sel:'#addTheme', title:'테마 추가',        body:'테마 하나 = 예약할 매장 하나예요. 여기를 눌러 필요한 만큼 추가하세요.'},
  {sel:'#themes',   title:'시간표 넣기',      body:'예약 가능한 회차를 직접 입력하거나, 예약 화면 캡처를 붙여넣으면(Ctrl+V) 자동으로 읽습니다. 매장 이름을 적어두면 매장 간 이동시간도 계산에 들어가요.'},
  {sel:'.opts',     title:'조건 정하기',      body:'가장 이른 시작·늦은 종료, 최소·최대 공백, 기본 이동시간 같은 조건을 정합니다.'},
  {sel:'#go',       title:'조합 계산',        body:'조건에 맞고 서로 겹치지 않는 조합을 전부 찾아줍니다.'},
  {sel:'#results',  title:'결과 확인',        body:'정렬 기준을 바꿔가며 훑어보고, 마음에 드는 조합은 저장해 두세요.'},
  {sel:'#shareBtn', title:'공유하기',         body:'지금 입력한 내용을 그대로 담은 링크를 복사합니다. 로그인 없이도 바로 공유할 수 있어요.'},
];
let tourStep=0, tourNodes=null;
function tourMount(){
  if(tourNodes) return tourNodes;
  const dim=document.createElement('div');  dim.className='tour-dim';
  const spot=document.createElement('div'); spot.className='tour-spot';
  const tip=document.createElement('div');  tip.className='tour-tip';
  document.body.append(dim,spot,tip);
  tourNodes={dim,spot,tip};
  return tourNodes;
}
function startTour(){
  tourStep=0;
  tourMount();
  showTourStep(0);
}
function endTour(){
  if(tourNodes){ tourNodes.dim.remove(); tourNodes.spot.remove(); tourNodes.tip.remove(); tourNodes=null; }
  localStorage.setItem(TOUR_KEY,'1');
}
function showTourStep(i){
  const step=TOUR_STEPS[i];
  const target=document.querySelector(step.sel);
  if(!target){                     // 그 순간 화면에 없는 요소면 건너뛴다
    if(i<TOUR_STEPS.length-1) showTourStep(i+1); else endTour();
    return;
  }
  tourStep=i;
  target.scrollIntoView({behavior:'smooth', block:'center'});
  setTimeout(()=>positionTour(target,step), 320);
}
function positionTour(target, step){
  const {spot,tip}=tourMount();
  const r=target.getBoundingClientRect();
  const pad=8;
  spot.style.top=(r.top-pad)+'px'; spot.style.left=(r.left-pad)+'px';
  spot.style.width=(r.width+pad*2)+'px'; spot.style.height=(r.height+pad*2)+'px';

  tip.innerHTML=`
    <div class="step">${tourStep+1} / ${TOUR_STEPS.length}</div>
    <h4>${esc(step.title)}</h4>
    <p>${esc(step.body)}</p>
    <div class="tour-btns">
      <button class="tour-skip" type="button">건너뛰기</button>
      <div class="tour-next-group">
        ${tourStep>0?'<button class="btn" data-tour="prev" type="button">이전</button>':''}
        <button class="btn-go" data-tour="next" type="button">${tourStep===TOUR_STEPS.length-1?'확인':'다음'}</button>
      </div>
    </div>`;
  tip.querySelector('.tour-skip').onclick=endTour;
  tip.querySelector('[data-tour=next]').onclick=()=> tourStep<TOUR_STEPS.length-1 ? showTourStep(tourStep+1) : endTour();
  const prevBtn=tip.querySelector('[data-tour=prev]');
  if(prevBtn) prevBtn.onclick=()=>showTourStep(tourStep-1);

  requestAnimationFrame(()=>{
    const th=tip.offsetHeight, tw=tip.offsetWidth, vw=innerWidth, vh=innerHeight;
    let top = r.bottom + pad + 14;
    if(top + th > vh - 16) top = Math.max(16, r.top - pad - 14 - th);
    const left = Math.min(Math.max(16, r.left), vw - tw - 16);
    tip.style.top=top+'px'; tip.style.left=left+'px';
    tip.classList.add('on');
  });
}
document.getElementById('tourBtn').onclick=startTour;
window.addEventListener('resize', ()=>{
  if(!tourNodes) return;
  const step=TOUR_STEPS[tourStep], target=document.querySelector(step.sel);
  if(target) positionTour(target, step);
});

/* ── 다크 모드 ──
   저장된 선택이 없으면 시스템 설정을 그대로 따르고([data-theme] 속성 자체를 안 둠),
   버튼을 누르면 그때부터 그 선택을 기억한다. */
const THEME_KEY='resched.theme';
const sysDark=()=>matchMedia('(prefers-color-scheme: dark)').matches;
function isDarkNow(){
  const t=document.documentElement.getAttribute('data-theme');
  return t ? t==='dark' : sysDark();
}
function applyTheme(t){
  if(t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  const dark=isDarkNow();
  document.getElementById('themeBtn').textContent = dark ? '라이트 모드' : '다크 모드';
  document.getElementById('themeColorMeta').content = dark ? '#14161A' : '#F2F4F6';
}
document.getElementById('themeBtn').onclick=()=>{
  const next = isDarkNow() ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
  if(!localStorage.getItem(THEME_KEY)) applyTheme(null);   // 저장된 선택이 없을 때만 시스템을 따라간다
});
applyTheme(localStorage.getItem(THEME_KEY));

/* ── 이미지 → 회차 (브라우저 내 OCR) ──
   인식은 전부 이 브라우저 안에서 돈다 — 이미지가 서버로 나가지 않고, API 키도 과금도 없다.
   엔진(PaddleOCR)은 모델까지 vendor/ 에 같이 들어 있어 CDN 없이 오프라인으로도 동작한다.
   전에는 tesseract + 손으로 짠 이진화 전처리를 썼다. PP-OCRv6 tiny 로 바꾼 뒤로는
   학습된 검출기가 색·배경과 무관하게 글자를 찾아내므로 그 전처리가 필요 없어졌다
   (기획 §4.25). 실제 구현은 아래 "PaddleOCR" 섹션. */
/* 인식 시간은 화소 수에 비례한다. 확대는 작은 캡처의 인식률을 올리지만
   무한정 키우면 몇 분씩 걸린다 — 가로 목표치와 총 화소 상한을 함께 건다. */
/* 폰이 느릴 것이라 보고 화소 예산을 절반으로 줄였다가 되돌렸다 —
   실기기에서 1080×2340 을 4초에 끝냈다. 느린 게 문제가 아니었고,
   줄인 만큼 글자만 작아져 오히려 인식이 나빠졌다. 예산은 PC 와 같게 두고
   제한시간만 넉넉히 남긴다(느린 기기가 있을 수는 있으므로). */
const OCR_MOBILE = matchMedia('(pointer:coarse)').matches || innerWidth < 700;
const OCR_TARGET_W=1200;
const OCR_MAX_PIXELS = 3.2e6;
const OCR_TIMEOUT_MS = OCR_MOBILE ? 210000 : 120000;

function handlePaste(e, th){
  const items=[...(e.clipboardData?.items||[])];
  const img=items.find(it=>it.type.startsWith('image/'));
  if(!img) return;              // 텍스트 붙여넣기는 그대로 통과
  e.preventDefault();
  clearIfOverwrite(th);
  readImage(img.getAsFile(), th);
}
/* tesseract 는 File/Blob 을 그대로 받는다 — base64 변환이 필요 없다. */
/* "이어 붙이기" 를 껐으면 새 배치를 시작하기 전에 지운다.
   한 번에 여러 장을 고른 경우 그 장들끼리는 여전히 합쳐진다 —
   덮어쓰는 대상은 "이전에 있던 값" 이지, "이번에 고른 여러 장" 이 아니다. */
function clearIfOverwrite(th){
  if(th.mergeMode===false){ th.raw=''; th.sessions=[]; th.imgCount=0; th.source=''; }
}
function readImage(file, th){ return ocr(file, th); }

/* 진행 상황은 카드 하단 한 칸만 갈아끼운다.
   renderThemes() 를 진행률마다 부르면 입력 중인 칸이 날아간다. */
function setBusy(th, msg){
  th.busy=msg;
  const card=elThemes.children[themes.indexOf(th)];
  const el=card&&card.querySelector('.busy');
  if(el) el.textContent=msg||'';
}
/* ── PaddleOCR (ONNX, 브라우저 내) ──
   tesseract 를 대신한다 — 학습된 검출기가 색·배경과 무관하게 글자 영역을 먼저 찾고
   나서 읽으므로, 예전처럼 손으로 이진화 기준을 맞출 필요가 없다.
   모델은 PP-OCRv6 tiny (검출 1.8MB + 인식 4.3MB) — 실측(카톡 캡처, 9개 회차)에서
   172MB짜리 "server" 모델보다도 정확하고 100배 가까이 빨랐다. vendor/ 에 모델까지
   같이 두어 tesseract 와 마찬가지로 CDN 없이 오프라인으로 동작한다.
   import map 으로 onnxruntime-web / ppu-ocv 맨몸 지정자를 vendor 경로에 매핑해 뒀으므로
   번들러 없이 동적 import() 만으로 붙는다 (index.html 은 여전히 classic 스크립트다). */
let paddleService=null, paddleLoading=null;
async function getPaddleService(onStep){
  if(paddleService) return paddleService;
  if(!paddleLoading) paddleLoading=(async()=>{
    onStep && onStep('엔진 준비 중');
    const ort=await import('onnxruntime-web');
    /* wasmPaths 를 먼저 정해 둬야 한다 — 안 그러면 ppu-paddle-ocr 가 이 값을 비어 있다고
       보고 jsDelivr CDN 주소로 채워 버린다(오프라인 원칙이 깨진다). ESM 모듈은 지정자당
       한 번만 로드되어 인스턴스를 공유하므로, ppu-paddle-ocr 가 나중에 같은 'onnxruntime-web'
       을 import 해도 이미 정해 둔 값을 그대로 본다. */
    ort.env.wasm.wasmPaths=new URL('vendor/onnxruntime-web/', location.href).href;
    ort.env.wasm.numThreads=1;   /* GitHub Pages 는 COOP/COEP 헤더를 못 붙이므로 스레드 병렬은 애초에 안 된다 */
    const { PaddleOcrService }=await import('ppu-paddle-ocr/web');
    onStep && onStep('모델 불러오는 중');
    const base=new URL('vendor/paddle-models/', location.href).href;
    const svc=new PaddleOcrService({
      model:{
        detection: base+'PP-OCRv6_tiny_det.ort',
        recognition: base+'PP-OCRv6_tiny_rec.ort',
        charactersDictionary: base+'ppocrv6_tiny_dict.txt',
      },
      session:{ executionProviders:['wasm'] },
    });
    await svc.initialize();
    paddleService=svc;
    return svc;
  })().catch(err=>{ paddleLoading=null; throw err; });
  return paddleLoading;
}
/* 검출기가 학습된 눈으로 글자를 찾으므로, tesseract 때처럼 이진화한 화면을 넘기면
   오히려 손해다(자연 이미지로 학습됐다) — 색은 그대로 두고 크기만 맞춘다. */
function preparePaddleCanvas(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let scale = img.width < 900 ? Math.min(3, OCR_TARGET_W/img.width) : 1;
      const px=img.width*img.height*scale*scale;
      if(px>OCR_MAX_PIXELS) scale*=Math.sqrt(OCR_MAX_PIXELS/px);
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*scale);
      cv.height=Math.round(img.height*scale);
      const cx=cv.getContext('2d',{willReadFrequently:true});
      cx.imageSmoothingQuality='high';
      cx.drawImage(img,0,0,cv.width,cv.height);
      cv._dim=img.width+'×'+img.height+'→'+cv.width+'×'+cv.height;
      res(cv);
    };
    img.onerror=()=>{
      URL.revokeObjectURL(url);
      const heic=/heic|heif/i.test(file.type||'') || /\.(heic|heif)$/i.test(file.name||'');
      rej(new Error(heic
        ? 'HEIC 사진은 못 읽습니다 — 캡처(스크린샷)를 넣거나 JPG 로 바꿔 주세요'
        : '이미지를 열지 못했습니다 ('+(file.type||'형식 불명')+')'));
    };
    img.src=url;
  });
}

async function ocr(file, th){
  th.err=''; th.busy='엔진 준비 중…'; renderThemes();
  const t0=performance.now();
  let shot='';                       /* 실제로 넘긴 크기 — 실패 원인 추적용 */
  try{
    const svc=await getPaddleService(label=>setBusy(th, label+'…'));
    setBusy(th, '이미지 다듬는 중…');
    const prepared=await preparePaddleCanvas(file);
    shot=prepared._dim||'';
    setBusy(th, '글자 읽는 중…');
    const result = await Promise.race([
      svc.recognize(prepared),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('시간 초과 — 이미지를 잘라서 다시 시도해 보세요')), OCR_TIMEOUT_MS))
    ]);
    const ss=parseSessions(result.text);
    shot += ' · 회차 '+ss.length;
    if(!ss.length) throw new Error('시간을 찾지 못했습니다');
    /* 시간표가 길어 캡처를 나눠 넣는 경우 — 있던 세션에 이번 세션을 절대시각으로 합친다.
       처음엔 텍스트를 이어 붙여 parseSessions 를 통째로 재적용했는데, 그 오름차순 12시간
       보정이 이미지 "사이"에도 걸려 사고가 났다 — 오후 캡처 다음에 오전 캡처를 이어 붙이면
       09:00 이 "시간이 거꾸로 갔다" 로 읽혀 21:00 으로 둔갑했다(실측). 같은 이미지를 두 번
       넣었을 때도 두 번째 사본이 같은 이유로 12시간 밀려 새벽 시각이 생겼다.
       보정은 "한 장 안에서" 만 해야 맞는다 — parseSessions 는 그 계약을 지키고, 문제는
       여러 장을 하나의 문자열로 합쳐 그 계약 밖에서 다시 돌린 것이었다. 그래서 텍스트가 아니라
       이미 절대시각으로 확정된 세션 배열을 합친다. 같은 시각이 겹치면 매진 여부만 OR 로 합친다. */
    const merged = new Map();
    for(const s of th.sessions) merged.set(s.t, s);
    for(const s of ss){
      const prev = merged.get(s.t);
      merged.set(s.t, prev ? {...s, soldout: prev.soldout || s.soldout} : s);
    }
    const hadRaw = th.raw.trim().length>0;
    th.sessions = [...merged.values()].sort((a,b)=>a.t-b.t);
    th.raw = sessionsToText(th.sessions);
    th.imgCount = hadRaw ? (th.imgCount||0)+1 : 1;
    th.source = (hadRaw && th.source!=='image' && th.source!=='image-edited') ? 'image-edited' : 'image';
  }catch(err){
    const sec=Math.round((performance.now()-t0)/1000);
    th.err='읽기 실패 — 시간을 직접 입력해 주세요. ('+err.message
         + (shot?' · '+shot:'') + ' · '+sec+'초)';
    /* 멈춰서 시간 초과된 세션을 그대로 두면 다음 시도도 똑같이 막힌다. 버리고 새로 만들게 한다.
       (단순 인식 실패는 엔진 잘못이 아니므로 그대로 재사용한다) */
    if(/시간 초과|엔진/.test(err.message)){
      try{ paddleService && paddleService.destroy(); }catch{}
      paddleService=null; paddleLoading=null;
    }
  }finally{
    th.busy=''; renderThemes();
  }
}

/* ── 정렬 버튼 ── */
let sortKey='gap', found=[];
const elSorts=document.getElementById('sorts');
/* 정렬은 필터가 아니라 같은 목록의 순서만 바꾸는 것이라, 다섯 칩이 전부 같은 숫자를
   갖는다 — 그래도 "지금 보고 있는 게 몇 개인지" 를 탭까지 위로 안 올라가도 보여준다. */
function renderSorts(){
  elSorts.innerHTML='';
  const n=currentList().length;
  SORTS.forEach(s=>{
    const b=document.createElement('button');
    b.className='sortbtn'+(s.k===sortKey?' on':'');
    b.innerHTML=`${s.label}<b>${n.toLocaleString()}</b>`;
    b.onclick=()=>{sortKey=s.k;renderSorts();renderResults();scheduleAutosave();};
    elSorts.appendChild(b);
  });
}

/* ── 결과 렌더 ── */
const elRes=document.getElementById('results'), elCount=document.getElementById('resCount');
const SHOW=12;

/* 어떤 테마들로 이루어진 조합인지를 나타내는 키. 부분 조합을 묶어 보여줄 때 쓴다. */
const setKey = r => r.steps.map(s=>s.i).sort((a,b)=>a-b).join(',');
const setLabel = k => k.split(',').map(i=>(themesReady[+i]||{}).name || ('테마 '+(+i+1))).join(' + ');

let tabCount=null, tabSet=null;

/* 부분 조합은 정렬 1차 키가 "테마 수 내림차순" 이라 전체 조합 아래에 파묻힌다.
   개수별로 탭을 나눠야 비로소 보인다. 조합 칩은 그 안에서 어느 테마 묶음인지 고르는 것. */
function renderTabs(){
  const el=document.getElementById('tabs');
  if(!found.length){ el.innerHTML=''; return; }
  const counts=[...new Set(found.map(r=>r.count))].sort((a,b)=>b-a);
  const maxC=counts[0];
  if(tabCount==null || !counts.includes(tabCount)) tabCount=maxC;
  let html='';
  if(counts.length>1){
    html += '<div class="tabrow">' + counts.map(c=>{
      const n=found.filter(r=>r.count===c).length;
      return `<button class="tab${c===tabCount?' on':''}" data-c="${c}">테마 ${c}개${c===maxC?' 전부':''}<b>${n.toLocaleString()}</b></button>`;
    }).join('') + '</div>';
  }
  if(tabCount<maxC){
    const inTab=found.filter(r=>r.count===tabCount);
    const sets=new Map();
    inTab.forEach(r=>{ const k=setKey(r); sets.set(k,(sets.get(k)||0)+1); });
    if(tabSet!=null && !sets.has(tabSet)) tabSet=null;
    html += '<div class="tabrow sets">'
      + `<button class="tab${tabSet==null?' on':''}" data-s="">전체<b>${inTab.length.toLocaleString()}</b></button>`
      + [...sets.entries()].sort((a,b)=>b[1]-a[1]).map(([k,n])=>
          `<button class="tab${k===tabSet?' on':''}" data-s="${k}">${esc(setLabel(k))}<b>${n.toLocaleString()}</b></button>`).join('')
      + '</div>';
  } else tabSet=null;
  el.innerHTML=html;
  el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ tabCount=+b.dataset.c; tabSet=null; renderTabs(); renderSorts(); renderResults(); });
  el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ tabSet=b.dataset.s||null; renderTabs(); renderSorts(); renderResults(); });
}

function currentList(){
  let list=found;
  if(tabCount!=null) list=list.filter(r=>r.count===tabCount);
  if(tabSet!=null)   list=list.filter(r=>setKey(r)===tabSet);
  return list;
}

function renderResults(){
  if(!found.length){
    elRes.innerHTML='<div class="empty">조건을 만족하는 조합이 없습니다. 최소 공백을 줄이거나 시간 범위를 넓혀보세요.</div>';
    return;
  }
  const pool=currentList();
  if(!pool.length){
    elRes.innerHTML='<div class="empty">이 묶음에는 조합이 없습니다.</div>';
    return;
  }
  const list=[...pool].sort(SORTS.find(s=>s.k===sortKey).f).slice(0,SHOW);
  const lo=Math.min(...list.map(r=>r.start)), hi=Math.max(...list.map(r=>r.end));
  const span=Math.max(hi-lo,60), pct=m=>((m-lo)/span)*100;

  elRes.innerHTML='';
  list.forEach((r,ri)=>{
    const d=document.createElement('div');
    d.className='res'+(ri===0?' best':'');
    const tight=r.minWait<10;
    d.innerHTML=`
      <div class="res-head">
        <span class="rank">${pad(ri+1)}</span>
        <span class="stat"><b class="mono">${fmt(r.start)} → ${fmt(r.end)}</b></span>
        <span class="stat">총 <b class="mono">${Math.round((r.end-r.start)/60*10)/10}h</b></span>
        ${r.moveTotal
          ? `<span class="stat mvstat">이동 <b class="mono">${r.moveTotal}분</b></span>`
          + `<span class="stat ${r.total-r.moveTotal<=30?'good':''}">잔여 <b class="mono">${r.total-r.moveTotal}분</b></span>`
          : `<span class="stat ${r.total<=30?'good':''}">공백 <b class="mono">${r.total}분</b></span>`}
        <span class="stat ${tight?'warn':''}">최소 <b class="mono">${r.minWait===Infinity?'—':r.minWait+'분'}</b></span>
        ${r.count<themesReady.length?`<span class="stat">테마 <b>${r.count}/${themesReady.length}</b></span>`:''}
        <button class="btn-copy" type="button">복사</button>
        ${CLOUD_ON?'<button class="btn-copy btn-save" type="button">저장</button>':''}
      </div>
      <div class="res-body">
        <div class="tlwrap"><div class="tlinner">
        <div class="tl">${
          r.steps.map(s=>{
            const l=pct(s.start), w=pct(s.end)-pct(s.start);
            return `<div class="blk${s.soldout?' so':''}" style="left:${l}%;width:${w}%" title="${esc(s.name)} ${fmt(s.start)}→${fmt(s.end)} (${s.dur}분)">
              <span class="nm"><i>${esc(s.name)}</i></span><span class="rng" data-s="${fmt(s.start)}">${fmt(s.start)} – ${fmt(s.end)}</span></div>`;
          }).join('') +
          r.steps.slice(1).map((s,k)=>{
            const p=r.steps[k], g=s.start-p.end;
            if(g<=0) return '';
            const mv=s.move||0, wait=g-mv;
            const l=pct(p.end), w=pct(s.start)-pct(p.end);
            /* 좁음/넓음 판정은 "노는 시간" 으로 한다. 이동 10분이 낀 15분 공백은
               여유가 5분뿐이라 빠듯한 것이지, 15분 쉬는 게 아니다. */
            const cls = wait<10 ? ' tight' : (wait>=40 ? ' big' : '');
            const tip = mv ? `${esc(p.place)} → ${esc(s.place)} 이동 ${mv}분 · 잔여 ${wait}분` : `공백 ${g}분`;
            let h=`<div class="gap${cls}" style="left:${l}%;width:${w}%" title="${tip}"></div>`;
            if(mv>0){
              /* 이동은 앞 테마가 끝나자마자 일어난다 — 공백의 앞쪽을 따로 칠한다 */
              const mw=pct(p.end+mv)-pct(p.end);
              h+=`<div class="mv" style="left:${l}%;width:${mw}%" title="${tip}"></div>`;
            }
            h+=`<div class="gaplab${cls}${mv?' hasmv':''}" style="left:${l}%;width:${w}%">`
             + (mv?`<em><b class="mvp">이동 ${mv}분</b><b class="wtp">잔여 ${wait}분</b></em>`
                 :`<em>${g}분</em>`)
             + `</div>`;
            return h;
          }).join('')
        }</div>
        <div class="axis">${axisTicks(lo,hi,span)}</div>
        </div></div>
        <div class="seq">${(()=>{
          const parts=[];
          r.steps.forEach((s,i)=>{
            if(i && s.move) parts.push(`<i class="mvtag">이동 ${s.move}분</i>`);
            parts.push(`<b>${fmt(s.start)}</b> ${esc(s.name)}`);
          });
          parts.push(`<b>${fmt(r.end)}</b> 종료`);
          return parts.join('  →  ');
        })()}</div>
      </div>`;
    /* 이 조합 한 건을 텍스트로 — 카톡에 그대로 붙여넣을 수 있게 */
    d.querySelector('.btn-copy').onclick = async e => {
      const btn=e.currentTarget;
      const ok = await copyText(resultToText(r));
      btn.textContent = ok ? '복사됨' : '실패';
      setTimeout(()=>{ btn.textContent='복사'; }, 1500);
    };
    const sv=d.querySelector('.btn-save');
    if(sv) sv.onclick = ()=> openSave(r);
    elRes.appendChild(d);
  });
  /* appendChild 뒤에야 실제 폭이 잡힌다. 넘치는 이름에만 훑기를 건다 —
     안 넘치는 이름까지 움직이면 눈만 피곤하다. */
  /* 1) 이름이 안 들어가는 블록이 있으면 타임라인 전체를 그 비율만큼 넓힌다.
        블록은 % 로 배치돼 있어 컨테이너만 넓히면 시간 비율을 유지한 채 전부 커진다.
        무한정 넓히면 스크롤이 과해지므로 4배에서 끊고, 나머지는 이름 훑기로 넘긴다. */
  elRes.querySelectorAll('.tlinner').forEach(inner=>{
    let factor=1;
    inner.querySelectorAll('.blk').forEach(b=>{
      const nm=b.querySelector('.nm i'), rng=b.querySelector('.rng');
      /* 여백은 CSS 에서 읽는다. 예전엔 18 을 박아 뒀는데, 디자인을 바꿔 padding 이
         늘어나자 계산이 모자라 시각이 "10:20 – 11:35" → "10:20" 으로 잘렸다. */
      const cs=getComputedStyle(b);
      const pad=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight)+2;
      const need=Math.max(nm?nm.scrollWidth:0, rng?rng.scrollWidth:0)+pad;
      const cur=b.clientWidth;
      if(cur>0 && need>cur) factor=Math.max(factor, need/cur);
    });
    factor=Math.min(factor,4);
    if(factor>1.01) inner.style.width=(factor*100)+'%';
  });

  /* 2) 그래도 좁으면 "13:30–14:45" 가 "13:30–1" 로 잘린다. 잘린 시각은 없느니만 못하므로
        들어갈 만큼만 남긴다: 시작–종료 → 시작만 → (그래도 안 되면) 생략. */
  elRes.querySelectorAll('.blk .rng').forEach(el=>{
    if(el.scrollWidth > el.clientWidth+1){
      el.textContent = el.dataset.s;
      if(el.scrollWidth > el.clientWidth+1) el.textContent = '';
    }
  });
  /* 3) 4배 상한에 걸려 여전히 넘치는 이름만 좌우로 훑는다 */
  elRes.querySelectorAll('.blk .nm').forEach(el=>{
    const inner=el.firstElementChild;
    const over=inner.scrollWidth-el.clientWidth;
    if(over>1){
      el.classList.add('roll');
      el.style.setProperty('--shift', (-over-2)+'px');
    }
  });
}
function axisTicks(lo,hi,span){
  const step=span>420?120:span>240?60:30;
  let s=Math.ceil(lo/step)*step, out='';
  for(let t=s;t<=hi;t+=step){
    out+=`<span class="tick" style="left:${((t-lo)/span)*100}%">${fmt(t)}</span>`;
  }
  return out;
}

/* ── 실행 ── */
const $ = id => document.getElementById(id);
/* 식사 시간 입력칸은 켰을 때만 보인다 */
/* 이동시간이 지금 실제로 걸리는지 한 줄로 알려 준다.
   매장을 안 적으면 조용히 0 이 되는데, 그걸 모르면 "왜 안 붙지" 가 된다. */
/* 매장 쌍마다 이동시간을 따로 받는다. 쌍은 매장 목록에서 자동으로 생기고,
   손대지 않은 쌍은 기본값을 따라간다 — 실제로 다른 쌍만 고치면 된다. */
let moveMap = {};
function placeList(){
  return [...new Set(themes.map(t=>(t.place||'').trim()).filter(Boolean))]
         .sort((a,b)=>a.localeCompare(b,'ko'));
}
function renderPairs(){
  const box=$('pairs'), ps=placeList();
  if(ps.length<2){ box.hidden=true; box.innerHTML=''; return; }
  const def=parseInt($('oMove').value)||0;
  let rows='';
  for(let i=0;i<ps.length;i++) for(let j=i+1;j<ps.length;j++){
    const v=moveMap[pairKey(ps[i],ps[j])];
    const set=v!=null;
    rows+=`<div class="pair${set?' set':''}">`
       + `<span class="pn">${esc(ps[i])}</span><span class="parr">↔</span><span class="pn">${esc(ps[j])}</span>`
       + `<input class="mono pv" data-i="${i}" data-j="${j}" inputmode="numeric" value="${set?v:def}">`
       + `<span class="unit">분</span></div>`;
  }
  box.hidden=false;
  box.innerHTML=`<div class="pairhead">매장 간 이동시간 <span>손대지 않은 칸은 기본값(${def}분)을 따라갑니다</span></div>${rows}`;
  box.querySelectorAll('.pv').forEach(el=>{
    el.oninput=e=>{
      const t=e.target;
      moveMap[pairKey(ps[+t.dataset.i], ps[+t.dataset.j])]=Math.max(0,parseInt(t.value)||0);
      t.closest('.pair').classList.add('set');
      refreshMoveHint();
    };
  });
}

function refreshMoveHint(){
  const el=$('moveHint'); if(!el) return;
  const named=themes.filter(t=>(t.place||'').trim());
  const places=new Set(named.map(t=>t.place.trim()));
  const m=parseInt($('oMove').value)||0;
  if(!named.length){
    el.className='movehint';
    el.innerHTML='테마에 <b>매장</b>을 적으면 매장이 바뀌는 자리에 이동시간이 붙습니다. 지금은 안 붙습니다.';
  }else if(places.size<2){
    el.className='movehint';
    el.innerHTML=`매장이 <b>${esc([...places][0])}</b> 한 곳이라 이동시간이 붙지 않습니다.`;
  }else if(!m){
    el.className='movehint';
    el.innerHTML=`매장 <b>${places.size}곳</b> — 이동시간이 <b>0분</b>이라 붙지 않습니다.`;
  }else{
    el.className='movehint on';
    const blank=themes.length-named.length;
    const ps=placeList(); let n=0, set=0;
    for(let i=0;i<ps.length;i++) for(let j=i+1;j<ps.length;j++){
      n++; if(moveMap[pairKey(ps[i],ps[j])]!=null) set++;
    }
    el.innerHTML=`매장 <b>${places.size}곳</b> · 쌍 <b>${n}개</b>`
      + (set?` (<b>${set}개</b>는 따로 지정)`:` · 전부 <b>${m}분</b>`)
      + (blank?` <span class="dimhint">· 매장을 안 적은 테마 ${blank}개는 제외</span>`:'');
  }
}
$('oMove').oninput = ()=>{ renderPairs(); refreshMoveHint(); };
$('oMeal').onchange = e => $('mealRow').classList.toggle('on', e.target.checked);
/* 당일 즉흥으로 짤 때 시작 하한을 현재 시각으로 */
$('nowBtn').onclick = () => { const d=new Date(); $('oStart').value = pad(d.getHours())+':'+pad(d.getMinutes()); };

function readOptions(){
  const partial=$('oPartial').checked;
  const o={
    startMin: parseClock($('oStart').value),
    endMax:   parseClock($('oEnd').value),
    minGap:   parseInt($('oMinGap').value)||0,
    maxGap:   ($('oMaxGap').value.trim()==='')?null:(parseInt($('oMaxGap').value)||null),
    moveMin:  parseInt($('oMove').value)||0,
    moveMap:  moveMap,
    /* 매진 회차는 애초에 예약할 수 없으므로 선택지로 두지 않는다.
       "매진" 이 붙어 들어온 회차만 여기서 걸러지고, 나머지는 사용자가 빼고 넣는다. */
    excludeSoldout: true,
    minCount: partial?2:themesReady.length,
    meal: null
  };
  if($('oMeal').checked){
    const from=parseClock($('oMealFrom').value), to=parseClock($('oMealTo').value);
    const min=parseInt($('oMealMin').value)||0;
    if(from!=null && to!=null && min>0) o.meal={from,to,min};
  }
  return o;
}

let themesReady=[];
let lastSnapshot=null;      // 마지막 계산에 쓰인 입력값 (저장용 — F-12)
$('go').onclick=()=>{
  const note=$('runNote');
  /* 잠근 카드의 "자리" 는 실제로 진행되는 순서 기준이다.
     회차가 없는 카드는 애초에 일정에 안 들어가므로 걸러낸 뒤의 인덱스를 쓴다. */
  themesReady=themes.filter(t=>t.sessions.length&&t.dur>0)
                    .map((t,i)=>({name:t.name||('테마 '+(i+1)),dur:t.dur,sessions:t.sessions,
                                  place:t.place||'',
                                  lockPos: t.lock ? i : null}));
  if(themesReady.length<2){ note.textContent='회차가 있는 테마가 2개 이상 필요합니다.'; found=[]; renderTabs(); renderSorts(); renderResults(); elCount.textContent=''; return; }

  const o=readOptions();
  /* 최대 공백이 식사 공백보다 작으면 서로 모순이라 결과가 0이 된다 — 미리 알려준다 */
  if(o.meal && o.maxGap!=null && o.maxGap<o.meal.min){
    note.textContent=`최대 공백(${o.maxGap}분)이 식사 공백(${o.meal.min}분)보다 작아 조합이 나올 수 없습니다.`;
    found=[]; renderTabs(); renderSorts(); renderResults(); elCount.textContent=''; return;
  }
  /* 이 순간의 입력값을 붙잡아 둔다. 저장할 때 다시 serialize() 하면,
     계산 뒤에 회차를 고치고 화면에 남아 있던 결과 카드의 [저장] 을 누르는 순간
     "확정 시각은 A, 입력값은 B" 인 문서가 만들어진다 — 불러와도 그 일정이 안 나온다. */
  lastSnapshot = serialize();
  const t0=performance.now();
  const {out,capped}=search(themesReady,o);
  found=out;
  const ms=Math.round(performance.now()-t0);
  tabCount=null; tabSet=null;      // 새로 계산하면 탭 선택을 초기화한다
  elCount.textContent=`${out.length.toLocaleString()}개 조합${capped?' (탐색 한도 도달)':''}`;
  note.textContent=`${ms}ms · 상위 ${Math.min(SHOW,currentList().length||out.length)}개 표시`;
  renderTabs();
  renderSorts();
  renderResults();
};

/* ── 공유: 링크(상태 직렬화) + 텍스트(카톡 등에 붙여넣기) ──
   서버가 없으므로 상태를 URL 해시에 담는다. raw 문자열만 있으면 회차는 다시 파싱되므로
   회차 배열까지 넣지 않는다 — 링크가 짧아지고 나중에 형식을 바꿔도 덜 깨진다. */
const b64e = str => btoa(Array.from(new TextEncoder().encode(str), c=>String.fromCharCode(c)).join(''))
                      .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d = str => new TextDecoder().decode(
  Uint8Array.from(atob(str.replace(/-/g,'+').replace(/_/g,'/')), ch=>ch.charCodeAt(0)));

function serialize(){
  return b64e(JSON.stringify({
    v:3,
    t: themes.map(t=>[t.name, t.dur, t.raw, t.lock?1:0, t.place||'']),
    /* 지금 화면에 있는 매장 쌍만 담는다 — 지운 매장의 값까지 링크에 끌고 다닐 이유가 없다 */
    m: (()=>{ const ps=placeList(), out=[];
        for(let i=0;i<ps.length;i++) for(let j=i+1;j<ps.length;j++){
          const v=moveMap[pairKey(ps[i],ps[j])];
          if(v!=null) out.push([ps[i],ps[j],v]);
        } return out; })(),
    o: [$('oStart').value, $('oEnd').value, $('oMinGap').value, $('oMaxGap').value,
        1, $('oPartial').checked?1:0,
        $('oMeal').checked?1:0, $('oMealFrom').value, $('oMealTo').value, $('oMealMin').value,
        $('oMove').value],
    k: sortKey
  }));
}
function restore(hash){
  const d=JSON.parse(b64d(hash));
  if(d.v!==1 && d.v!==2 && d.v!==3) throw new Error('알 수 없는 링크 형식');
  themes = d.t.map(([name,dur,raw,lock,place])=>{
    const th=blank(name); th.dur=dur; th.raw=raw||'';
    th.lock=!!lock;                 // v1 의 'first'/'last' 문자열도 참으로 읽혀 자리 고정이 된다
    th.place=place||'';             // v1·v2 링크에는 없다 — 빈칸이면 이동시간이 안 붙는다
    th.sessions=parseSessions(th.raw); th.source=th.raw?'manual':'';
    return th;
  });
  const [a,b,c2,dd,so,pt,me,mf,mt,mm,mv]=d.o;
  $('oStart').value=a; $('oEnd').value=b; $('oMinGap').value=c2; $('oMaxGap').value=dd;
  $('oPartial').checked=!!pt;   // so 슬롯은 옛 링크 호환용으로 남겨두고 쓰지 않는다
  $('oMeal').checked=!!me; $('mealRow').classList.toggle('on',!!me);
  $('oMealFrom').value=mf; $('oMealTo').value=mt; $('oMealMin').value=mm;
  if(mv!==undefined) $('oMove').value=mv;
  moveMap={};
  if(Array.isArray(d.m)) for(const [a,b,v] of d.m) moveMap[pairKey(a,b)]=v;
  renderPairs(); refreshMoveHint();
  if(d.k) sortKey=d.k;
}

async function copyText(text, note){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch{
    /* 클립보드 권한이 없거나 http 인 경우 — 선택 가능한 형태로 대체한다 */
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok=false;
    try{ ok=document.execCommand('copy'); }catch{}
    ta.remove();
    return ok;
  }
}
$('shareBtn').onclick = async ()=>{
  const note=$('runNote');
  /* 주소창을 건드리지 않는다. 예전엔 여기서 location.hash 를 바꿨는데,
     그러면 그 뒤로 새로고침할 때마다 그때의 상태가 되살아나 기본값을 덮어쓴다. */
  const url = location.origin + location.pathname + '#s=' + serialize();
  const ok = await copyText(url);
  if(ok){ note.textContent='링크를 복사했습니다.'; }
  else {
    location.hash = 's=' + serialize();   // 복사가 막힌 경우에만 주소창으로 대체
    note.textContent='복사가 막혀 주소창에 넣었습니다. 주소창 링크를 복사해 주세요.';
  }
};

/* ── 마지막 상태 자동 복구 (localStorage) ──
   저장소가 아니라 편의다(기획 §4.16) — 진짜 보관은 링크가 맡는다. 여기 있는 값은
   경고 없이 사라질 수 있다(브라우저 데이터 삭제, iOS 사파리 7일 미방문 등).
   그래서 공유 링크와 똑같은 직렬화 포맷을 그대로 재사용한다 — 형식을 두 벌 관리하지 않는다. */
const AUTOSAVE_KEY='resched.laststate';
let autosaveTimer=null;
function scheduleAutosave(){
  clearTimeout(autosaveTimer);
  autosaveTimer=setTimeout(()=>{
    try{ localStorage.setItem(AUTOSAVE_KEY, serialize()); }catch(e){ /* 저장공간 꽉 참 등 — 조용히 넘어간다 */ }
  }, 400);
}
/* 테마 카드 안 입력칸(이름·매장·시간·raw)은 입력 중 리렌더를 피하려고 renderThemes() 를
   안 거치고 값만 바꾼다 — 그래서 이 위임 리스너가 따로 필요하다. 조건 칸들도 마찬가지. */
document.addEventListener('input', scheduleAutosave);
document.addEventListener('change', scheduleAutosave);

/* 결과 한 건을 사람이 읽는 형태로 — 카톡·메모에 그대로 붙여넣는 용도 */
function resultToText(r){
  const dur = m => (m>=60 ? Math.floor(m/60)+'시간 '+(m%60?(m%60)+'분':'') : m+'분').trim();
  const head = `${r.count}연방 · ${fmt(r.start)} → ${fmt(r.end)} (${dur(r.end-r.start)}, `
    + (r.moveTotal ? `이동 ${r.moveTotal}분 · 잔여 ${r.total-r.moveTotal}분)` : `공백 ${r.total}분)`);
  const body = r.steps.map((s,i)=>{
    const line = `${fmt(s.start)}–${fmt(s.end)}  ${s.name}${s.place?` @${s.place}`:''} (${s.dur}분)`;
    const nx = r.steps[i+1];
    if(!nx) return line;
    const g = nx.start - s.end, mv = nx.move||0;
    return line + (mv ? `\n     ↓ 이동 ${mv}분  잔여 ${g-mv}분` : `\n     ↓ 공백 ${g}분`);
  }).join('\n');
  return head + '\n\n' + body;
}


/* ══ 계정 · 일정 보관 ═══════════════════════════════════════════════
   이 아래는 전부 부가 기능이다. 설정이 비어 있거나(FIREBASE_CONFIG)
   네트워크가 없으면 조용히 꺼질 뿐, 위의 조합 계산은 영향을 받지 않는다.
   cloud.js 와 Firebase SDK 는 로그인 버튼을 눌러야 처음 내려온다 —
   로그인을 안 쓰는 사람에게는 예전과 바이트 단위로 같은 앱이다.
   ═══════════════════════════════════════════════════════════════ */

const CLOUD_ON = !!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey
                 && window.FIREBASE_CONFIG.projectId && window.FIREBASE_CONFIG.appId);
const SEEN_KEY = 'resched.signedin';   /* 예전에 로그인한 적이 있는가 — 이때만 자동 복귀를 시도한다 */

let Cloud = null, me = null, plans = [], pending = null, authMode = 'in';
const cloud = async () => (Cloud || (Cloud = await import('./cloud.js')));

const today = () => { const d=new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };

/* ── 계정 줄 ── */
function renderAcct(){
  const el=$('acct');
  if(!CLOUD_ON){
    el.innerHTML = `<span title="firebase-config.js 가 비어 있습니다. README 의 '계정 만들고 일정 저장하기' 참고">일정 저장 꺼짐</span>`;
    return;
  }
  el.innerHTML = me
    ? `<span><b>${esc(me.id)}</b> 님</span><button class="btn" id="outBtn" type="button">로그아웃</button>`
    : `<span>일정을 저장해 두려면</span><button class="btn" id="inBtn" type="button">로그인</button>`;
  const ib=$('inBtn'), ob=$('outBtn');
  if(ib) ib.onclick = ()=> openAuth('in');
  if(ob) ob.onclick = async ()=>{
    try{ (await cloud()).signOut(); }catch{}
    localStorage.removeItem(SEEN_KEY);
    me=null; plans=[]; renderAcct(); renderPlans();
  };
}

/* ── 로그인 / 가입 모달 ── */
function openAuth(mode){
  authMode = mode;
  const up = mode==='up';
  $('authTitle').textContent = up ? '가입' : '로그인';
  $('authSub').textContent = up
    ? '아이디와 비밀번호만 정하면 끝입니다. 이메일도, 인증 메일도 없습니다.'
    : '아이디와 비밀번호를 넣어 주세요.';
  $('authGo').textContent = up ? '가입하고 시작' : '로그인';
  $('authPw').setAttribute('autocomplete', up ? 'new-password' : 'current-password');
  $('authSwap').innerHTML = up
    ? `이미 아이디가 있나요? <b class="lk">로그인</b>`
    : `아이디가 없나요? <b class="lk">가입</b> · <b>비밀번호를 잊으면 되찾을 방법이 없습니다</b> (메일 주소를 안 받기 때문). 다른 곳에서 쓰는 비밀번호는 쓰지 마세요.`;
  const lk=$('authSwap').querySelector('.lk');
  lk.style.cssText='color:var(--blue-text);font-weight:600;cursor:pointer;text-decoration:underline';
  lk.onclick = ()=> openAuth(up?'in':'up');
  $('authErr').textContent='';
  $('authModal').classList.add('on');
  setTimeout(()=>$('authId').focus(), 30);
}
function closeAuth(){ $('authModal').classList.remove('on'); $('authPw').value=''; }

async function submitAuth(){
  /* toEmail 이 소문자로 낮추므로 Tester 와 tester 는 같은 계정이다.
     화면에 보이는 것과 실제가 어긋나지 않게 입력칸부터 맞춰 둔다. */
  const id=$('authId').value.trim().toLowerCase(), pw=$('authPw').value;
  $('authId').value=id;
  const err=$('authErr'), go=$('authGo');
  const C = await cloud().catch(()=>null);
  if(!C){ err.textContent='로그인 모듈을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'; return; }
  if(!C.ID_RE.test(id)){ err.textContent='아이디 형식이 맞지 않습니다 — ' + C.ID_HINT; return; }
  if(pw.length<6){ err.textContent='비밀번호는 6자 이상이어야 합니다.'; return; }
  go.disabled=true; go.textContent='잠시만…'; err.textContent='';
  try{
    me = authMode==='up' ? await C.signUp(id,pw) : await C.signIn(id,pw);
    localStorage.setItem(SEEN_KEY,'1');
    closeAuth(); renderAcct(); await loadPlans();
  }catch(e){
    err.textContent = C.say(e);
  }finally{
    go.disabled=false; go.textContent = authMode==='up' ? '가입하고 시작' : '로그인';
  }
}

/* ── 저장 모달 ── */
function openSave(r){
  if(!me){ openAuth('in'); return; }
  pending = r;
  $('savePreview').textContent =
    `${r.count}연방 · ${fmt(r.start)} → ${fmt(r.end)} · 공백 ${r.total}분`;
  $('saveDate').value = today();
  $('saveMemo').value = '';
  $('saveErr').textContent = '';
  segSet('wish');
  $('saveModal').classList.add('on');
}
function segSet(v){
  $('saveSeg').querySelectorAll('button').forEach(b=> b.classList.toggle('on', b.dataset.v===v));
}
const segGet = () => $('saveSeg').querySelector('button.on').dataset.v;

async function submitSave(){
  const r=pending; if(!r) return;
  const err=$('saveErr'), go=$('saveGo');
  const date=$('saveDate').value;
  if(!date){ err.textContent='날짜를 골라 주세요.'; return; }
  go.disabled=true; go.textContent='저장 중…'; err.textContent='';
  try{
    const C = await cloud();
    /* 확정된 시각을 그대로 굳혀 둔다. snapshot 은 "다시 짜기" 용 입력값일 뿐이라
       나중에 계산 로직이 바뀌면 순위가 달라질 수 있다 — 지나간 일정이 그때 함께 바뀌면 안 된다. */
    await C.savePlan({
      date, status: segGet(), memo: $('saveMemo').value.trim(),
      count: r.count, start: r.start, end: r.end, total: r.total,
      minGap: r.minGap===Infinity ? null : r.minGap,
      steps: r.steps.map(x=>({ name:x.name, dur:x.dur, start:x.start, end:x.end })),
      snapshot: lastSnapshot || serialize(),
    });
    $('saveModal').classList.remove('on');
    pending=null;
    await loadPlans();
    $('planSec').scrollIntoView({behavior:'smooth', block:'start'});
  }catch(e){
    err.textContent = (await cloud()).say(e);
  }finally{
    go.disabled=false; go.textContent='저장';
  }
}

/* ── 내 일정 목록 ── */
async function loadPlans(){
  if(!me){ plans=[]; renderPlans(); return; }
  try{ plans = await (await cloud()).listPlans(); }
  catch(e){ plans=[]; console.warn('일정 불러오기 실패:', e); }
  renderPlans();
}

function renderPlans(){
  const sec=$('planSec'), box=$('plans');
  sec.hidden = !me;
  if(!me) return;
  $('planCount').textContent = plans.length ? plans.length + '건' : '';
  if(!plans.length){
    box.innerHTML = `<div class="empty">아직 저장한 일정이 없습니다. 결과 카드의 <b>저장</b> 을 눌러 보세요.</div>`;
    return;
  }
  box.innerHTML = plans.map(p=>{
    const wish = p.status==='wish';
    const seq = (p.steps||[]).map(x=>`<b>${fmt(x.start)}</b> ${esc(x.name)}`).join('  →  ');
    return `<div class="plan ${wish?'wish':'done'}" data-id="${p.id}">
      <span class="pd">${esc(p.date||'')}</span>
      <span class="tag ${wish?'wish':'done'}">${wish?'하고 싶음':'했음'}</span>
      <span class="pspan">${fmt(p.start)} → ${fmt(p.end)} · ${p.count}연방 · 공백 ${p.total}분</span>
      <span class="pbtns">
        <button class="btn" data-a="load" type="button">불러오기</button>
        <button class="btn" data-a="flip" type="button">${wish?'했음으로':'하고 싶음으로'}</button>
        <button class="btn" data-a="del"  type="button">삭제</button>
      </span>
      <span class="pseq">${seq}  →  <b>${fmt(p.end)}</b> 종료</span>
      ${p.memo?`<span class="pmemo">${esc(p.memo)}</span>`:''}
    </div>`;
  }).join('');

  box.querySelectorAll('.plan').forEach(el=>{
    const id=el.dataset.id, p=plans.find(x=>x.id===id);
    el.querySelectorAll('button[data-a]').forEach(b=> b.onclick = async ()=>{
      const C = await cloud();
      if(b.dataset.a==='load'){
        try{
          restore(p.snapshot);
          /* 옛 결과 카드를 남겨두면 그 [저장] 버튼이 아직 이전 계산 결과를 붙들고 있다.
             화면과 입력이 어긋난 채로 저장되는 길을 아예 막는다. */
          found=[]; themesReady=[]; lastSnapshot=null; tabCount=null; tabSet=null;
          renderThemes(); renderSorts(); renderTabs(); renderResults();
          $('resCount').textContent='';
          window.scrollTo({top:0, behavior:'smooth'});
          $('runNote').textContent = `${p.date} 일정의 입력값을 불러왔습니다. 계산을 누르면 다시 짤 수 있습니다.`;
        }catch{ $('runNote').textContent='이 일정은 불러올 수 없는 형식입니다.'; }
        return;
      }
      if(b.dataset.a==='flip'){
        const next = p.status==='wish' ? 'done' : 'wish';
        b.disabled=true;
        try{ await C.patchPlan(id,{status:next}); p.status=next; renderPlans(); }
        catch(e){ b.disabled=false; console.warn(e); }
        return;
      }
      if(b.dataset.a==='del'){
        if(!confirm(`${p.date} 일정을 지울까요?`)) return;
        b.disabled=true;
        try{ await C.removePlan(id); plans=plans.filter(x=>x.id!==id); renderPlans(); }
        catch(e){ b.disabled=false; console.warn(e); }
      }
    });
  });
}

/* ── 배선 ── */
if(CLOUD_ON){
  $('authGo').onclick     = submitAuth;
  $('authCancel').onclick = closeAuth;
  $('authPw').onkeydown = e => { if(e.key==='Enter') submitAuth(); };
  $('authId').onkeydown = e => { if(e.key==='Enter') $('authPw').focus(); };
  $('saveGo').onclick     = submitSave;
  $('saveCancel').onclick = ()=>{ $('saveModal').classList.remove('on'); pending=null; };
  $('saveSeg').onclick = e => { if(e.target.dataset.v) segSet(e.target.dataset.v); };
  /* 바깥을 눌러도 닫힌다 */
  ['authModal','saveModal'].forEach(k=> $(k).onclick = e => {
    if(e.target.id===k) e.target.classList.remove('on');
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape'){
      document.querySelectorAll('.modal.on').forEach(m=>m.classList.remove('on'));
      if(tourNodes) endTour();
    }
  });

  /* 예전에 로그인한 적이 있을 때만 SDK 를 미리 깨운다.
     한 번도 안 쓴 사람에게 5MB 짜리 짐을 지우지 않기 위해서다. */
  if(localStorage.getItem(SEEN_KEY)){
    cloud().then(C => C.watch(u=>{ me=u; renderAcct(); loadPlans(); }))
           .catch(e=> console.warn('로그인 복귀 실패:', e));
  }
}

/* ── init ── */
/* 공유 링크로 들어온 경우 상태를 되살린다. 형식이 깨졌으면 조용히 무시하고 빈 화면으로 시작한다.
   링크가 없으면 마지막으로 자동 저장해 둔 상태를 대신 복구한다(기획 §4.16) — 매번 링크를
   눌러야만 이전 입력이 돌아오는 건 아니다. 둘 다 없거나 깨졌으면 빈 화면(§4.22). */
if(location.hash.startsWith('#s=')){
  try{
    restore(location.hash.slice(3));
  }catch(err){
    console.warn('링크 복원 실패:', err.message);
    themes=[];
  }
}else{
  const saved=localStorage.getItem(AUTOSAVE_KEY);
  if(saved){
    try{ restore(saved); }
    catch(err){ console.warn('저장된 상태 복원 실패:', err.message); }
  }
}
renderThemes(); renderSorts(); renderAcct(); renderPairs(); refreshMoveHint();
if(!localStorage.getItem(TOUR_KEY)) setTimeout(startTour, 500);  // 처음 온 사람에게만, 화면이 자리 잡은 뒤에
</script>
