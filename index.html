<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방탈출 스케줄러</title>
<meta name="description" content="방탈출 테마별 회차 시간을 넣으면 겹치지 않는 조합을 전부 계산해 주는 도구">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🗝️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15110E; --panel:#1E1815; --panel2:#2A221B; --line:#3B2F25;
  --brass:#C99A4C; --brass-dim:#8C6A32;
  --paper:#EDE4D6; --muted:#9A8B79;
  --muted2:#BCAB94;              /* 결과 화면의 보조 텍스트 — 기존 muted 는 어두워 잘 안 읽힌다 */
  --blk:#3A2E22; --blk-line:#B08843;   /* 타임라인 블록: 배경과 테두리 모두 한 단계 밝게 */
  --sage:#7FA88A; --brick:#C4574A;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--paper);
  font-family:'IBM Plex Sans KR',system-ui,sans-serif;
  font-size:14px; line-height:1.55;
  padding:0 0 80px;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ── header ── */
header{border-bottom:1px solid var(--line);padding:34px 0 24px;margin-bottom:28px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
h1 .dim{color:var(--brass)}
header p{margin:0;color:var(--muted);font-size:13px;max-width:52ch}

/* ── sections ── */
.sec{margin-bottom:30px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sec-head h2{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);margin:0}
.sec-head span{font-size:12px;color:var(--muted)}
.sec-head .hi{color:var(--paper);font-weight:600}
.sec-head .count{font-size:12px;color:var(--paper);font-weight:600;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:1px 9px}

/* ── theme cards ── */
.themes{display:flex;flex-direction:column;gap:12px}
.addrow{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.addhint{font-size:11.5px;color:var(--muted)}
.addhint b{color:var(--paper)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.drag{border-color:var(--brass);background:var(--panel2)}
.card-top{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.idx{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass-dim);width:22px;flex:none}
input,textarea,select{
  background:var(--ink);border:1px solid var(--line);color:var(--paper);
  border-radius:var(--r);padding:7px 9px;font-family:inherit;font-size:13px;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brass)}
.i-name{flex:1;min-width:120px}
.i-dur{width:78px}
.unit{color:var(--muted);font-size:12px;margin-left:-4px}
textarea{width:100%;min-height:60px;resize:vertical;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.7}
.card-foot{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn-img{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);color:var(--paper);padding:5px 11px;font-size:12px;border-radius:var(--r);cursor:pointer}
.btn-img:hover{border-color:var(--brass-dim)}
.btn-img input{display:none}
/* 입력한 것이 어떻게 해석됐는지 바로 보여주는 줄.
   12시간 보정은 조용히 일어나면 사고가 되므로(순서가 섞이면 엉뚱한 값이 된다) 눈에 보이게 한다. */
.parsed{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:8px}
.parsed .t{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--paper);
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:1px 7px}
.parsed .t.fix{border-color:var(--brass-dim);color:var(--brass)}
.parsed .t.so{color:var(--brick);border-color:var(--brick);opacity:.7;text-decoration:line-through}
.parsed .t.over{border-color:var(--brick);color:var(--brick)}
.parsed .hint{font-size:11px;color:var(--muted)}
.parsed .note{flex-basis:100%;font-size:11px;color:var(--muted);margin-top:1px}
.parsed .warn{flex-basis:100%;font-size:11.5px;color:var(--brick);margin-top:2px;line-height:1.5}
.parsed .warn b{color:var(--paper)}
.chip{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
.chip .src{color:var(--brass-dim)}
.chip b{color:var(--sage);font-weight:600}
.chip i{color:var(--brick);font-style:normal}

/* ── buttons ── */
button{font-family:inherit;cursor:pointer;border-radius:var(--r);transition:.13s}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--paper);padding:7px 13px;font-size:12.5px}
.btn:hover{border-color:var(--brass-dim)}
.btn-x{background:none;border:1px solid transparent;color:var(--muted);padding:4px 8px;font-size:16px;line-height:1}
.btn-x:hover{color:var(--brick);border-color:var(--line)}
.btn-go{
  background:var(--brass);border:1px solid var(--brass);color:#1A1208;
  padding:11px 30px;font-size:14px;font-weight:700;letter-spacing:.02em;
}
.btn-go:hover{background:#DCAA55}
.btn-go:disabled{opacity:.45;cursor:default}

/* ── options ── */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.opt label{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:4px}
.opt input,.opt select{width:100%}
.checks{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.mini{background:none;border:1px solid var(--line);color:var(--muted2);font-size:10.5px;padding:1px 6px;margin-left:6px}
.mini:hover{border-color:var(--brass-dim);color:var(--brass)}
.mealrow{display:none;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:12.5px}
.mealrow.on{display:flex}
.mealrow input{width:74px}
.mealrow .lb{color:var(--muted2)}
/* 드래그 손잡이 겸 순서 번호. 잠그면 황동색으로 바뀌어 "이 자리" 임을 알린다 */
.idx{cursor:grab}
.idx:active{cursor:grabbing}
.card.locked .idx{color:var(--brass);font-weight:700}
.card.dragging{opacity:.45}
.card.over{border-color:var(--brass);box-shadow:inset 0 3px 0 -1px var(--brass)}
.lockbtn{background:none;border:1px solid var(--line);color:var(--muted2);font-size:11.5px;padding:4px 9px}
.lockbtn:hover{border-color:var(--brass-dim);color:var(--brass)}
.lockbtn.on{background:var(--brass);border-color:var(--brass);color:#1A1208;font-weight:600}
.btn-copy{background:none;border:1px solid var(--line);color:var(--muted2);font-size:11px;padding:2px 8px;margin-left:auto}
.btn-copy:hover{border-color:var(--brass-dim);color:var(--brass)}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--paper);cursor:pointer}
.chk input{width:14px;height:14px;accent-color:var(--brass)}
.run{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
.run .note{font-size:12px;color:var(--muted)}

/* ── result tabs ── */
.tabrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabrow.sets{margin-bottom:12px;padding-left:2px}
.tab{background:none;border:1px solid var(--line);color:var(--muted2);padding:5px 12px;font-size:12px}
.tab b{color:var(--paper);font-weight:600;margin-left:3px}
.tab:hover{border-color:var(--brass-dim)}
.tab.on{background:var(--panel2);border-color:var(--brass);color:var(--paper)}
.tab.on b{color:var(--brass)}
.tabrow.sets .tab{font-size:11.5px;padding:3px 10px}

/* ── sort ── */
.sorts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sortbtn{background:none;border:1px solid var(--line);color:var(--muted);padding:5px 12px;font-size:12px}
.sortbtn.on{background:var(--brass);border-color:var(--brass);color:#1A1208;font-weight:600}

/* ── results ── */
.res{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.res.best{border-color:var(--brass)}
.res-head{display:flex;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rank{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--brass);font-weight:600;width:26px;flex:none}
.stat{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted2)}
.stat b{color:var(--paper);font-weight:600}
.stat.warn b{color:var(--brick)}
.stat.good b{color:var(--sage)}
.res-body{padding:14px}

/* 블록 폭은 소요시간에 비례해야 하므로 이름 길이로 늘릴 수 없다 (시간축이 거짓말이 된다).
   대신 타임라인 전체를 필요한 만큼 넓히고 가로로 스크롤한다 — 비율은 그대로, 이름은 다 들어간다. */
.tlwrap{overflow-x:auto;overflow-y:hidden}
.tlinner{min-width:100%}
.tlwrap::-webkit-scrollbar{height:6px}
.tlwrap::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

/* signature: timeline
   위: 테마 블록(이름 + 시작–종료)   아래: 공백 라벨   그 아래: 시간축 */
.tl{position:relative;height:68px;margin-bottom:4px}
.blk{position:absolute;top:0;height:44px;background:var(--blk);border:1px solid var(--blk-line);
  border-radius:3px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;
  padding:0 8px;gap:1px}
.blk .nm{overflow:hidden;white-space:nowrap}
.blk .nm i{display:inline-block;font-style:normal;font-size:12px;font-weight:600;color:var(--paper)}
/* 이름이 블록보다 길면 잘라내지 않고 좌우로 천천히 훑는다 (--shift = 넘친 만큼) */
.blk .nm.roll i{animation:roll 6s ease-in-out infinite alternate}
@keyframes roll{from{transform:translateX(0)}to{transform:translateX(var(--shift,0))}}
.blk .rng{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--brass);
  white-space:nowrap;overflow:hidden;letter-spacing:-.02em}
.blk.so{border-style:dashed;border-color:var(--brick)}
.blk.so .rng{color:var(--brick)}

/* 공백: 막대에는 빗금 영역만, 숫자는 막대 아래에 둔다 */
.gap{position:absolute;top:0;height:44px;border-radius:3px;
  border-left:1px dashed var(--line);border-right:1px dashed var(--line);
  background:repeating-linear-gradient(-45deg,transparent 0 4px,rgba(188,171,148,.18) 4px 8px)}
.gap.big{background:repeating-linear-gradient(-45deg,transparent 0 4px,rgba(201,154,76,.26) 4px 8px);
  border-color:var(--brass-dim)}
.gap.tight{background:repeating-linear-gradient(-45deg,transparent 0 4px,rgba(196,87,74,.30) 4px 8px);
  border-color:var(--brick)}
.gaplab{position:absolute;top:46px;height:18px;display:flex;align-items:center;justify-content:center}
.gaplab em{font-family:'IBM Plex Mono',monospace;font-size:11px;font-style:normal;font-weight:600;
  color:var(--muted2);white-space:nowrap}
.gaplab.big em{color:var(--brass)}
.gaplab.tight em{color:var(--brick)}

.axis{position:relative;height:16px;border-top:1px solid var(--line)}
.tick{position:absolute;top:2px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted2);transform:translateX(-50%)}
.tick::before{content:'';position:absolute;left:50%;top:-3px;height:3px;border-left:1px solid var(--brass-dim)}
.seq{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted2);margin-top:9px}
.seq b{color:var(--paper);font-weight:600}
/* ── misc ── */
.empty{color:var(--muted);font-size:13px;padding:26px 0;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
.err{color:var(--brick);font-size:12.5px;margin-top:8px}
.busy{color:var(--brass);font-size:12px}
@media(max-width:560px){
  .card-top{gap:7px}.i-name{min-width:90px}
  .res-head{gap:9px}
  h1{font-size:21px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}
  .blk .nm.roll i{animation:none}
  .blk .nm{text-overflow:ellipsis}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>방탈출 <span class="dim">스케줄러</span></h1>
  <p>테마별 회차 시간을 넣으면 겹치지 않는 조합을 전부 계산해서, 공백이 어디에 얼마나 생기는지 보여줍니다.</p>
</header>

<section class="sec">
  <div class="sec-head">
    <h2>테마</h2>
    <b class="count" id="themeCount"></b>
    <span>붙여넣거나 직접 입력 · <b class="hi">매진된 회차는 빼고 넣어 주세요</b></span>
  </div>
  <div class="themes" id="themes"></div>
  <div class="addrow">
    <button class="btn" id="addTheme">＋ 테마 추가</button>
    <button class="btn" id="seedBtn" type="button">기본값 채우기</button>
    <span class="addhint"><b>순서는 도구가 정합니다.</b> 번호를 끌어 옮기고 <b>자리 고정</b>을 누르면 그 자리에 묶입니다 · <b>×</b> 로 삭제</span>
  </div>
</section>

<section class="sec">
  <div class="sec-head"><h2>조건</h2></div>
  <div class="opts">
    <div class="opt"><label>가장 이른 시작<button class="mini" id="nowBtn" type="button">지금부터</button></label><input class="mono" id="oStart" placeholder="13:00"></div>
    <div class="opt"><label>가장 늦은 종료</label><input class="mono" id="oEnd" placeholder="22:00"></div>
    <div class="opt"><label>최소 공백 (분)</label><input class="mono" id="oMinGap" value="10"></div>
    <div class="opt"><label>최대 공백 (분)</label><input class="mono" id="oMaxGap" placeholder="90"></div>
  </div>
  <div class="checks">
    <label class="chk"><input type="checkbox" id="oPartial"> 일부 테마만 넣은 조합도 계산</label>
    <label class="chk"><input type="checkbox" id="oMeal"> 식사 시간 확보</label>
  </div>
  <div class="mealrow" id="mealRow">
    <input class="mono" id="oMealFrom" value="11:30">
    <span class="lb">~</span>
    <input class="mono" id="oMealTo" value="14:00">
    <span class="lb">사이에</span>
    <input class="mono" id="oMealMin" value="40">
    <span class="lb">분 이상 공백을 남긴다</span>
  </div>
  <div class="run">
    <button class="btn-go" id="go">조합 계산</button>
    <button class="btn" id="shareBtn" type="button">링크 복사</button>
    <span class="note" id="runNote"></span>
  </div>
</section>

<section class="sec">
  <div class="sec-head"><h2>결과</h2><span id="resCount"></span></div>
  <div id="tabs"></div>
  <div class="sorts" id="sorts"></div>
  <div id="results"><div class="empty">테마 회차를 넣고 계산을 눌러주세요.</div></div>
</section>

</div>

<script>
/* ══ @core:start ══════════════════════════════════════════════════
   DOM에 의존하지 않는 순수 로직 구간.
   test/acceptance.mjs가 이 구간만 잘라내 그대로 실행하므로,
   여기에는 document/window를 참조하는 코드를 넣지 않는다.
   ════════════════════════════════════════════════════════════════ */

/* ── 시간 유틸 ── */
const pad = n => String(n).padStart(2,'0');
const fmt = m => pad(Math.floor(m/60)%24)+':'+pad(m%60);
function parseClock(s){
  const m = String(s||'').trim().match(/^(\d{1,2})\s*:\s*(\d{2})$/);
  if(!m) return null;
  const h=+m[1], mi=+m[2];
  if(h>29||mi>59) return null;
  return h*60+mi;
}

/* ── 회차 텍스트 파싱 ── */
/* "오전 10:30 매진 오후 12:00 매진 …" 또는 "10:30, 12:00, 1:30" 모두 처리 */
function parseSessions(text){
  const out=[];
  const toks = String(text||'').split(/[\s,·|\n\r\t]+/).filter(Boolean);
  let mer=null, sawMer=false;
  for(const tk of toks){
    if(/오전|AM/i.test(tk) && !/\d{1,2}:\d{2}/.test(tk)){ mer='am'; sawMer=true; continue; }
    if(/오후|PM/i.test(tk) && !/\d{1,2}:\d{2}/.test(tk)){ mer='pm'; sawMer=true; continue; }
    const hit = tk.match(/(오전|오후|AM|PM)?\s*(\d{1,2}):(\d{2})/i);
    if(hit){
      let lm = mer;
      if(hit[1]){ lm = /오전|AM/i.test(hit[1]) ? 'am':'pm'; sawMer=true; }
      let h=+hit[2], mi=+hit[3];
      if(lm==='pm' && h<12) h+=12;
      if(lm==='am' && h===12) h=0;
      out.push({t:h*60+mi, soldout:false});
      mer=null;
      continue;
    }
    if(/매진|마감|SOLD/i.test(tk) && out.length) out[out.length-1].soldout=true;
  }
  /* 1) 바로 옆에 같은 시각이 또 나오면 같은 칸을 두 번 읽은 것 → 접는다.
        떨어져 있는 같은 시각은 접으면 안 된다. 오전/오후가 한 바퀴 돈 것이기 때문:
        "10:30 12:00 … 9:00 10:30" 의 마지막 10:30 은 22:30 이다.
        (인접이냐 아니냐가 노이즈와 오후 한 바퀴를 가르는 기준) */
  const seq=[];
  for(const s of out){
    const prev=seq[seq.length-1];
    if(prev && prev.t===s.t){ prev.soldout = prev.soldout || s.soldout; continue; }
    seq.push(s);
  }
  /* 2) 오전/오후 표기가 전혀 없으면 오름차순 가정하고 12시간 보정.
        보정한 항목에는 표시를 남긴다 — 화면에서 "내가 친 것과 다르게 읽혔다" 를
        보여주기 위해서다. 이 보정은 순서가 뒤섞이면 엉뚱한 값을 만들므로 숨기면 안 된다. */
  if(!sawMer){
    for(let i=1;i<seq.length;i++){
      const before=seq[i].t;
      while(seq[i].t <= seq[i-1].t) seq[i].t += 12*60;
      if(seq[i].t!==before) seq[i].fixed=true;
    }
  }
  /* 3) 보정이 끝난 절대시각 기준으로 최종 중복 제거 */
  const byT=new Map();
  for(const s of seq){
    const prev=byT.get(s.t);
    if(prev){ prev.soldout = prev.soldout || s.soldout; continue; }
    byT.set(s.t,s);
  }
  return [...byT.values()].sort((a,b)=>a.t-b.t);
}
function sessionsToText(ss){
  return ss.map(s=>fmt(s.t)+(s.soldout?' 매진':'')).join('  ');
}

/* ── 조합 탐색 ── */
/* 폭주 방지용 상한. 요구 범위(테마 3~5개)는 상한에 걸리지 않고 전수 탐색된다 —
   테마 5개 / 회차 9~10개가 약 1.1만 조합, 10ms 수준.
   상한에 걸리면 결과 개수 옆에 "탐색 한도 도달"로 표시한다(조용히 자르지 않는다). */
const NODE_CAP=800000, KEEP_CAP=50000;
function search(list, o){
  const n=list.length, used=new Array(n).fill(false), path=[], out=[];
  let nodes=0, capped=false;
  function record(){
    /* 식사 공백: "공백을 줄여라" 가 아니라 "한 군데는 크게 비워라" 는 요구다.
       경로가 완성돼야 판정할 수 있으므로 가지치기가 아니라 여기서 거른다.
       창과 겹치는 길이로 따진다 — 11:00~13:00 공백은 11:30~14:00 창을 90분 채운다. */
    if(o.meal){
      let ok=false;
      for(let i=1;i<path.length;i++){
        const ov=Math.min(path[i].start,o.meal.to)-Math.max(path[i-1].end,o.meal.from);
        if(ov>=o.meal.min){ ok=true; break; }
      }
      if(!ok) return;
    }
    const gaps=[];
    for(let i=1;i<path.length;i++) gaps.push(path[i].start-path[i-1].end);
    const total=gaps.reduce((a,b)=>a+b,0);
    const avg=gaps.length?total/gaps.length:0;
    const varc=gaps.length?Math.sqrt(gaps.reduce((a,g)=>a+(g-avg)**2,0)/gaps.length):0;
    out.push({
      steps:path.map(p=>({...p})), count:path.length,
      start:path[0].start, end:path[path.length-1].end,
      total, gaps, varc, minGap:gaps.length?Math.min(...gaps):Infinity
    });
  }
  function dfs(curEnd){
    if(out.length>=KEEP_CAP||nodes>NODE_CAP){capped=true;return;}
    if(path.length>=o.minCount) record();
    for(let i=0;i<n;i++){
      if(used[i])continue;
      const th=list[i];
      /* 자리를 잠근 테마는 그 자리에만 놓는다 (lockPos 는 0부터 센 순서).
         맨 앞만 잠그면 "첫 타 고정", 맨 뒤만 잠그면 "마지막 고정",
         전부 잠그면 "이 순서 그대로" 가 된다 — 개념 하나로 셋을 다 덮는다. */
      if(th.lockPos!=null && th.lockPos!==path.length) continue;
      for(const s of th.sessions){
        if(o.excludeSoldout&&s.soldout)continue;
        if(o.startMin!=null&&s.t<o.startMin)continue;
        if(path.length){
          const g=s.t-curEnd;
          if(g<o.minGap)continue;
          if(o.maxGap!=null&&g>o.maxGap)continue;
        }
        const end=s.t+th.dur;
        if(o.endMax!=null&&end>o.endMax)continue;
        nodes++;
        used[i]=true; path.push({i,name:th.name||('테마 '+(i+1)),dur:th.dur,start:s.t,end,soldout:s.soldout});
        dfs(end);
        path.pop(); used[i]=false;
        if(nodes>NODE_CAP){capped=true;return;}
      }
    }
  }
  dfs(null);
  return {out,capped};
}

/* ── 정렬 ── */
const SORTS=[
  {k:'gap',   label:'공백 적은 순',  f:(a,b)=>b.count-a.count||a.total-b.total||a.end-b.end},
  {k:'end',   label:'빨리 끝나는 순',f:(a,b)=>b.count-a.count||a.end-b.end||a.total-b.total},
  {k:'even',  label:'공백 고른 순',  f:(a,b)=>b.count-a.count||a.varc-b.varc||a.total-b.total},
  {k:'late',  label:'늦게 시작 순',  f:(a,b)=>b.count-a.count||b.start-a.start||a.total-b.total},
  {k:'safe',  label:'여유 있는 순',  f:(a,b)=>b.count-a.count||b.minGap-a.minGap||a.total-b.total},
];

/* ── 상태 ── */
let themes=[], nextId=1;
function blank(name){ return {id:nextId++, name:name||'', dur:70, raw:'', sessions:[], busy:'', err:'', source:'', lock:false}; }

/* 시작할 때 채워두는 기본 데이터. 매번 손으로 넣지 않고 바로 눌러볼 수 있게 한다.
   지우고 쓰면 되고, 공유 링크로 들어오면 이 값은 덮어써진다. */
const SEED=[
  ['범계',      75, '10:30  12:00  13:30  15:00  16:30  18:00  19:30  21:00  22:30'],
  ['몽',        70, '10:50  12:10  13:30  14:50  16:10  17:30  18:50  20:10  21:30  22:50'],
  ['왓 어 트립', 70, '10:20  11:45  13:10  14:35  16:00  17:25  18:50  20:15  21:40  23:05'],
];
function seed(){
  return SEED.map(([name,dur,raw])=>{
    const th=blank(name); th.dur=dur; th.raw=raw;
    th.sessions=parseSessions(raw); th.source='manual';
    return th;
  });
}
themes = seed();

/* ── 테마 렌더 ── */
const elThemes = document.getElementById('themes');
const DRAG_TYPE='application/x-theme-index';
function renderThemes(){
  elThemes.innerHTML='';
  /* "3연방" 처럼 지금 몇 개를 짜고 있는지 헤더에 띄운다.
     추가·삭제가 가능하다는 사실 자체가 잘 안 보였다. */
  const n=themes.length;
  document.getElementById('themeCount').textContent = n>=2 ? n+'연방' : n+'개';
  if(!n){
    elThemes.innerHTML='<div class="empty">테마가 없습니다. 아래 ＋ 테마 추가를 눌러 주세요.</div>';
    return;
  }
  themes.forEach((th,i)=>{
    const c=document.createElement('div');
    c.className='card'+(th.lock?' locked':'');
    c.innerHTML=`
      <div class="card-top">
        <span class="idx">${pad(i+1)}</span>
        <input class="i-name" placeholder="테마 이름" value="${esc(th.name)}" data-k="name">
        <input class="i-dur mono" value="${th.dur}" data-k="dur" inputmode="numeric">
        <span class="unit">분</span>
        <button class="lockbtn${th.lock?' on':''}" data-k="lock" type="button"
          title="이 카드를 지금 자리에 고정합니다. 잠그지 않은 카드는 도구가 알아서 배치합니다">${th.lock?'자리 고정됨':'자리 고정'}</button>
        <button class="btn-x" data-k="del" title="삭제">×</button>
      </div>
      <textarea data-k="raw" placeholder="10:00  13:10  15:40  17:20  ← 예약 가능한 회차만 (쉼표·줄바꿈도 됨)&#10;또는 예약 화면 캡처를 붙여넣기 (Ctrl+V)">${esc(th.raw)}</textarea>
      <div class="parsed">${parsedHTML(th)}</div>
      <div class="card-foot">
        <label class="btn-img">이미지 첨부<input type="file" accept="image/*" data-k="file"></label>
        <span class="chip">${chipHTML(th)}</span>
        <span class="busy">${th.busy?esc(th.busy):''}</span>
        <span class="err">${th.err?esc(th.err):''}</span>
      </div>`;
    c.querySelector('[data-k=name]').oninput = e => th.name=e.target.value;
    c.querySelector('[data-k=dur]').oninput  = e => th.dur=Math.max(1,parseInt(e.target.value)||0);
    c.querySelector('[data-k=lock]').onclick = ()=>{ th.lock=!th.lock; renderThemes(); };
    c.querySelector('[data-k=del]').onclick  = ()=>{ themes=themes.filter(x=>x!==th); renderThemes(); };
    const ta=c.querySelector('[data-k=raw]');
    ta.oninput = e => {
      th.raw=e.target.value;
      th.sessions=parseSessions(th.raw);
      th.source = th.source.startsWith('image') ? 'image-edited' : 'manual';
      th.err='';
      refreshFoot(c,th);
    };
    ta.onpaste = e => handlePaste(e, th);
    /* 모바일·윈도우용 첨부 경로. 폰에서는 앨범/카메라가 열린다.
       같은 파일을 다시 골라도 change 가 뜨도록 value 를 비운다. */
    c.querySelector('[data-k=file]').onchange = e => {
      const f = e.target.files && e.target.files[0];
      e.target.value = '';
      if(f) readImage(f, th);
    };
    /* 번호를 잡고 끌면 카드 순서가 바뀐다. 이미지 드롭과 섞이지 않도록
       전용 타입으로 구분한다 — dragover 에서는 getData 를 못 읽지만 types 는 읽을 수 있다. */
    const handle=c.querySelector('.idx');
    handle.draggable=true;
    handle.ondragstart = e => {
      e.dataTransfer.setData(DRAG_TYPE, String(i));
      e.dataTransfer.effectAllowed='move';
      c.classList.add('dragging');
    };
    handle.ondragend = ()=>{
      c.classList.remove('dragging');
      elThemes.querySelectorAll('.card').forEach(x=>x.classList.remove('over'));
    };
    c.addEventListener('dragover', e=>{
      e.preventDefault();
      c.classList.add([...e.dataTransfer.types].includes(DRAG_TYPE) ? 'over' : 'drag');
    });
    c.addEventListener('dragleave',()=>{ c.classList.remove('drag'); c.classList.remove('over'); });
    c.addEventListener('drop', e=>{
      e.preventDefault(); c.classList.remove('drag'); c.classList.remove('over');
      if([...e.dataTransfer.types].includes(DRAG_TYPE)){
        const from=+e.dataTransfer.getData(DRAG_TYPE);
        if(!Number.isNaN(from) && from!==i){
          const [moved]=themes.splice(from,1);
          themes.splice(i,0,moved);
          renderThemes();
        }
        return;
      }
      const f=[...(e.dataTransfer.files||[])].find(f=>f.type.startsWith('image/'));
      if(f) readImage(f, th);
    });
    elThemes.appendChild(c);
  });
}
/* 자정을 넘긴 값은 fmt 가 24로 나눈 나머지를 주므로 25:10 이 01:10 로 보인다.
   그대로 두면 "왜 새벽 1시가 있지?" 가 되므로 넘김을 밝혀서 표시한다. */
function fmtDay(t){ return t>=24*60 ? '다음날 '+fmt(t) : fmt(t); }

function chipHTML(th){
  const avail=th.sessions.filter(s=>!s.soldout).length;
  const sold=th.sessions.length-avail;
  const src = th.source==='image' ? '사진에서 읽음'
            : th.source==='image-edited' ? '사진 → 수정함'
            : th.sessions.length ? '직접 입력' : '';
  const cnt = th.sessions.length ? `회차 <b>${avail}</b>${sold?` · 매진 <i>${sold}</i>`:''} ` : '회차 없음';
  return (src ? `<span class="src">${esc(src)}</span> · ` : '') + cnt;
}
/* 입력한 것이 어떻게 해석됐는지 그대로 보여준다. 계산을 누르기 전에 확인할 수 있어야 한다. */
function parsedHTML(th){
  if(!th.sessions.length)
    return '<span class="hint">시간을 넣으면 해석 결과가 여기 표시됩니다</span>';
  const over = th.sessions.some(s=>s.t>=24*60);
  const fixed = th.sessions.some(s=>s.fixed);
  const sold = th.sessions.filter(s=>s.soldout).length;
  let out = th.sessions.map(s=>{
    const cls = 't' + (s.t>=24*60?' over':'') + (s.fixed?' fix':'') + (s.soldout?' so':'');
    const tip = s.fixed ? ' title="오전/오후 표기가 없어 12시간 보정된 값입니다"' : '';
    return `<span class="${cls}"${tip}>${fmtDay(s.t)}${s.soldout?' 매진':''}</span>`;
  }).join('');
  if(sold) out += `<span class="note">매진으로 읽힌 ${sold}개는 계산에서 제외됩니다</span>`;
  if(over) out += `<span class="warn">자정을 넘긴 회차가 있습니다. 이른 시간부터 순서대로 넣었는지 확인해 주세요 — 순서가 섞였다면 <b>오전</b>/<b>오후</b>를 붙이면 순서와 무관하게 정확해집니다.</span>`;
  else if(fixed) out += `<span class="note">황동색은 12시간 보정된 값입니다 (예: 1:10 → 13:10)</span>`;
  return out;
}

/* 카드 하단을 다시 그린다.
   에러 칸을 빼먹으면 사용자가 직접 입력해 문제를 해결한 뒤에도 옛 에러 문구가 남아

function esc(s){ return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
document.getElementById('addTheme').onclick=()=>{ themes.push(blank('')); renderThemes(); };

/* ── 이미지 → 회차 (브라우저 내 OCR) ── */
/* 인식은 전부 이 브라우저 안에서 돈다 — 이미지가 서버로 나가지 않고, API 키도 과금도 없다.
   엔진(tesseract)은 vendor/ 에 같이 들어 있어 CDN 없이 오프라인으로도 동작한다.

   숫자와 콜론만 읽으면 충분하다. "오전/오후" 는 읽지 않는다 —
   parseSessions 의 오름차순 12시간 보정이 복원해 주기 때문이다.
   (실제 예약 화면으로 검증: 숫자만으로 9개 회차 전부 정확히 복원됨)
   글자 후보를 숫자와 콜론으로 제한하면 한글 데이터(약 12MB)가 통째로 불필요하고,
   달력의 날짜 숫자는 콜론이 없어 parseSessions 단계에서 자연히 걸러진다. */
/* 상대경로로 주면 워커 내부에서 기준이 달라져 core/데이터를 못 찾고 그대로 멈춘다.
   페이지 기준 절대 URL 로 고정한다. */
const OCR_BASE=new URL('vendor/tesseract/', location.href).href;
let ocrWorker=null, ocrLoading=null;

/* 예약 화면의 회차 글자는 대개 옅은 회색(#bcbcbc 언저리)이라,
   tesseract 의 기본 이진화에서 배경으로 묻혀 통째로 사라진다.
   실측: 전처리 없이 0/9 → 전처리 후 9/9. 이 단계가 인식률의 전부다.
   그래서 넘기기 전에 직접 이진화한다 (회색조 → 임계값으로 흑백 이분),
   더불어 가로 1500px 정도로 확대한다. 작은 캡처일수록 효과가 크다. */
const OCR_THRESHOLD=235;
/* 인식 시간은 화소 수에 비례한다. 확대는 작은 캡처의 인식률을 올리지만
   무한정 키우면 몇 분씩 걸린다 — 가로 목표치와 총 화소 상한을 함께 건다. */
const OCR_TARGET_W=1200, OCR_MAX_PIXELS=3.2e6, OCR_TIMEOUT_MS=120000;

function preprocess(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let scale=Math.min(3, Math.max(1, OCR_TARGET_W/img.width));
      const px=img.width*img.height*scale*scale;
      if(px>OCR_MAX_PIXELS) scale*=Math.sqrt(OCR_MAX_PIXELS/px);   // 상한 초과분만 되돌린다
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*scale);
      cv.height=Math.round(img.height*scale);
      const cx=cv.getContext('2d',{willReadFrequently:true});
      cx.imageSmoothingQuality='high';
      cx.drawImage(img,0,0,cv.width,cv.height);
      const d=cx.getImageData(0,0,cv.width,cv.height), a=d.data;
      /* 다크모드 예약 화면(어두운 배경 + 밝은 글자)이면 기준을 뒤집는다.
         안 그러면 화면 전체가 글자로 판정돼 아무것도 못 읽는다. */
      let sum=0;
      for(let i=0;i<a.length;i+=4) sum+=0.299*a[i]+0.587*a[i+1]+0.114*a[i+2];
      const dark=(sum/(a.length/4))<128;
      for(let i=0;i<a.length;i+=4){
        const g=0.299*a[i]+0.587*a[i+1]+0.114*a[i+2];
        const ink=dark ? g>(255-OCR_THRESHOLD) : g<OCR_THRESHOLD;
        const v=ink?0:255;
        a[i]=a[i+1]=a[i+2]=v; a[i+3]=255;
      }
      cx.putImageData(d,0,0);
      cv.toBlob(b=> b?res(b):rej(new Error('이미지 변환 실패')), 'image/png');
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('이미지를 열지 못했습니다')); };
    img.src=url;
  });
}

function handlePaste(e, th){
  const items=[...(e.clipboardData?.items||[])];
  const img=items.find(it=>it.type.startsWith('image/'));
  if(!img) return;              // 텍스트 붙여넣기는 그대로 통과
  e.preventDefault();
  readImage(img.getAsFile(), th);
}
/* tesseract 는 File/Blob 을 그대로 받는다 — base64 변환이 필요 없다. */
function readImage(file, th){ ocr(file, th); }

/* 진행 상황은 카드 하단 한 칸만 갈아끼운다.
   renderThemes() 를 진행률마다 부르면 입력 중인 칸이 날아간다. */
function setBusy(th, msg){
  th.busy=msg;
  const card=elThemes.children[themes.indexOf(th)];
  const el=card&&card.querySelector('.busy');
  if(el) el.textContent=msg||'';
}
function loadScript(src){
  return new Promise((res,rej)=>{
    const el=document.createElement('script');
    el.src=src; el.onload=res;
    el.onerror=()=>rej(new Error('인식 엔진을 불러오지 못했습니다'));
    document.head.appendChild(el);
  });
}
const OCR_STEP={
  'loading tesseract core':'엔진 준비 중',
  'initializing tesseract':'엔진 초기화 중',
  'loading language traineddata':'인식 데이터 내려받는 중',
  'initializing api':'준비 중',
  'recognizing text':'글자 읽는 중',
};
/* 워커는 한 번만 만들고 이후 재사용한다 (두 번째 이미지부터는 즉시 인식).
   동시에 여러 장을 넣어도 같은 로딩을 공유하도록 Promise 를 캐시한다. */
async function getOcrWorker(onStep){
  if(ocrWorker) return ocrWorker;
  if(!ocrLoading) ocrLoading=(async()=>{
    if(!window.Tesseract) await loadScript(OCR_BASE+'tesseract.min.js');
    const w=await Tesseract.createWorker('eng', 1, {
      workerPath: OCR_BASE+'worker.min.js',
      corePath:   OCR_BASE,
      langPath:   OCR_BASE,
      logger: m => onStep && onStep(m),
    });
    /* 숫자 화이트리스트는 쓰지 않는다. 걸면 "오전/오후" 의 한글 획이 숫자로
       억지 매핑돼 시각 앞에 들러붙는다 (실측: 3:00 → 23:00, 6:00 → 56:00).
       제한 없이 읽게 두면 한글은 알파벳 잡음이 되고 시각 정규식이 알아서 걸러낸다. */
    ocrWorker=w;
    return w;
  })().catch(err=>{ ocrLoading=null; throw err; });
  return ocrLoading;
}

async function ocr(file, th){
  th.err=''; th.busy='엔진 준비 중…'; renderThemes();
  try{
    const step=m=>{
      const label=OCR_STEP[m.status];
      if(label) setBusy(th, label+(m.progress?` ${Math.round(m.progress*100)}%`:'')+'…');
    };
    const w=await getOcrWorker(step);
    setBusy(th,'이미지 다듬는 중…');
    const prepared=await preprocess(file);
    setBusy(th,'글자 읽는 중…');
    const { data:{ text } } = await Promise.race([
      w.recognize(prepared, {}, { text:true }),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('시간 초과 — 이미지를 잘라서 다시 시도해 보세요')), OCR_TIMEOUT_MS))
    ]);
    const ss=parseSessions(text);
    if(!ss.length) throw new Error('시간을 찾지 못했습니다');
    th.sessions=ss; th.raw=sessionsToText(ss); th.source='image';
  }catch(err){
    th.err='읽기 실패 — 시간을 직접 입력해 주세요. ('+err.message+')';
    /* 멈춰서 시간 초과된 워커를 그대로 두면 다음 시도도 똑같이 막힌다. 버리고 새로 만들게 한다.
       (단순 인식 실패는 워커 잘못이 아니므로 그대로 재사용한다) */
    if(/시간 초과|엔진/.test(err.message)){
      try{ ocrWorker && ocrWorker.terminate(); }catch{}
      ocrWorker=null; ocrLoading=null;
    }
  }finally{
    th.busy=''; renderThemes();
  }
}

/* ── 정렬 버튼 ── */
let sortKey='gap', found=[];
const elSorts=document.getElementById('sorts');
function renderSorts(){
  elSorts.innerHTML='';
  SORTS.forEach(s=>{
    const b=document.createElement('button');
    b.className='sortbtn'+(s.k===sortKey?' on':'');
    b.textContent=s.label;
    b.onclick=()=>{sortKey=s.k;renderSorts();renderResults();};
    elSorts.appendChild(b);
  });
}

/* ── 결과 렌더 ── */
const elRes=document.getElementById('results'), elCount=document.getElementById('resCount');
const SHOW=12;

/* 어떤 테마들로 이루어진 조합인지를 나타내는 키. 부분 조합을 묶어 보여줄 때 쓴다. */
const setKey = r => r.steps.map(s=>s.i).sort((a,b)=>a-b).join(',');
const setLabel = k => k.split(',').map(i=>(themesReady[+i]||{}).name || ('테마 '+(+i+1))).join(' + ');

let tabCount=null, tabSet=null;

/* 부분 조합은 정렬 1차 키가 "테마 수 내림차순" 이라 전체 조합 아래에 파묻힌다.
   개수별로 탭을 나눠야 비로소 보인다. 조합 칩은 그 안에서 어느 테마 묶음인지 고르는 것. */
function renderTabs(){
  const el=document.getElementById('tabs');
  if(!found.length){ el.innerHTML=''; return; }
  const counts=[...new Set(found.map(r=>r.count))].sort((a,b)=>b-a);
  const maxC=counts[0];
  if(tabCount==null || !counts.includes(tabCount)) tabCount=maxC;
  let html='';
  if(counts.length>1){
    html += '<div class="tabrow">' + counts.map(c=>{
      const n=found.filter(r=>r.count===c).length;
      return `<button class="tab${c===tabCount?' on':''}" data-c="${c}">테마 ${c}개${c===maxC?' 전부':''}<b>${n.toLocaleString()}</b></button>`;
    }).join('') + '</div>';
  }
  if(tabCount<maxC){
    const inTab=found.filter(r=>r.count===tabCount);
    const sets=new Map();
    inTab.forEach(r=>{ const k=setKey(r); sets.set(k,(sets.get(k)||0)+1); });
    if(tabSet!=null && !sets.has(tabSet)) tabSet=null;
    html += '<div class="tabrow sets">'
      + `<button class="tab${tabSet==null?' on':''}" data-s="">전체<b>${inTab.length.toLocaleString()}</b></button>`
      + [...sets.entries()].sort((a,b)=>b[1]-a[1]).map(([k,n])=>
          `<button class="tab${k===tabSet?' on':''}" data-s="${k}">${esc(setLabel(k))}<b>${n.toLocaleString()}</b></button>`).join('')
      + '</div>';
  } else tabSet=null;
  el.innerHTML=html;
  el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ tabCount=+b.dataset.c; tabSet=null; renderTabs(); renderResults(); });
  el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ tabSet=b.dataset.s||null; renderTabs(); renderResults(); });
}

function currentList(){
  let list=found;
  if(tabCount!=null) list=list.filter(r=>r.count===tabCount);
  if(tabSet!=null)   list=list.filter(r=>setKey(r)===tabSet);
  return list;
}

function renderResults(){
  if(!found.length){
    elRes.innerHTML='<div class="empty">조건을 만족하는 조합이 없습니다. 최소 공백을 줄이거나 시간 범위를 넓혀보세요.</div>';
    return;
  }
  const pool=currentList();
  if(!pool.length){
    elRes.innerHTML='<div class="empty">이 묶음에는 조합이 없습니다.</div>';
    return;
  }
  const list=[...pool].sort(SORTS.find(s=>s.k===sortKey).f).slice(0,SHOW);
  const lo=Math.min(...list.map(r=>r.start)), hi=Math.max(...list.map(r=>r.end));
  const span=Math.max(hi-lo,60), pct=m=>((m-lo)/span)*100;

  elRes.innerHTML='';
  list.forEach((r,ri)=>{
    const d=document.createElement('div');
    d.className='res'+(ri===0?' best':'');
    const tight=r.minGap<10;
    d.innerHTML=`
      <div class="res-head">
        <span class="rank">${pad(ri+1)}</span>
        <span class="stat"><b class="mono">${fmt(r.start)} → ${fmt(r.end)}</b></span>
        <span class="stat">총 <b class="mono">${Math.round((r.end-r.start)/60*10)/10}h</b></span>
        <span class="stat ${r.total<=30?'good':''}">공백 <b class="mono">${r.total}분</b></span>
        <span class="stat ${tight?'warn':''}">최소 <b class="mono">${r.minGap===Infinity?'—':r.minGap+'분'}</b></span>
        ${r.count<themesReady.length?`<span class="stat">테마 <b>${r.count}/${themesReady.length}</b></span>`:''}
        <button class="btn-copy" type="button">복사</button>
      </div>
      <div class="res-body">
        <div class="tlwrap"><div class="tlinner">
        <div class="tl">${
          r.steps.map(s=>{
            const l=pct(s.start), w=pct(s.end)-pct(s.start);
            return `<div class="blk${s.soldout?' so':''}" style="left:${l}%;width:${w}%" title="${esc(s.name)} ${fmt(s.start)}→${fmt(s.end)} (${s.dur}분)">
              <span class="nm"><i>${esc(s.name)}</i></span><span class="rng" data-s="${fmt(s.start)}">${fmt(s.start)} – ${fmt(s.end)}</span></div>`;
          }).join('') +
          r.steps.slice(1).map((s,k)=>{
            const p=r.steps[k], g=s.start-p.end;
            if(g<=0) return '';
            const l=pct(p.end), w=pct(s.start)-pct(p.end);
            const cls = g<10 ? ' tight' : (g>=40 ? ' big' : '');
            return `<div class="gap${cls}" style="left:${l}%;width:${w}%" title="공백 ${g}분"></div>`
                 + `<div class="gaplab${cls}" style="left:${l}%;width:${w}%"><em>${g}분</em></div>`;
          }).join('')
        }</div>
        <div class="axis">${axisTicks(lo,hi,span)}</div>
        </div></div>
        <div class="seq">${r.steps.map(s=>`<b>${fmt(s.start)}</b> ${esc(s.name)}`).join('  →  ')}  →  <b>${fmt(r.end)}</b> 종료</div>
      </div>`;
    /* 이 조합 한 건을 텍스트로 — 카톡에 그대로 붙여넣을 수 있게 */
    d.querySelector('.btn-copy').onclick = async e => {
      const btn=e.currentTarget;
      const ok = await copyText(resultToText(r));
      btn.textContent = ok ? '복사됨' : '실패';
      setTimeout(()=>{ btn.textContent='복사'; }, 1500);
    };
    elRes.appendChild(d);
  });
  /* appendChild 뒤에야 실제 폭이 잡힌다. 넘치는 이름에만 훑기를 건다 —
     안 넘치는 이름까지 움직이면 눈만 피곤하다. */
  /* 1) 이름이 안 들어가는 블록이 있으면 타임라인 전체를 그 비율만큼 넓힌다.
        블록은 % 로 배치돼 있어 컨테이너만 넓히면 시간 비율을 유지한 채 전부 커진다.
        무한정 넓히면 스크롤이 과해지므로 4배에서 끊고, 나머지는 이름 훑기로 넘긴다. */
  elRes.querySelectorAll('.tlinner').forEach(inner=>{
    let factor=1;
    inner.querySelectorAll('.blk').forEach(b=>{
      const nm=b.querySelector('.nm i'), rng=b.querySelector('.rng');
      const need=Math.max(nm?nm.scrollWidth:0, rng?rng.scrollWidth:0)+18;
      const cur=b.clientWidth;
      if(cur>0 && need>cur) factor=Math.max(factor, need/cur);
    });
    factor=Math.min(factor,4);
    if(factor>1.01) inner.style.width=(factor*100)+'%';
  });

  /* 2) 그래도 좁으면 "13:30–14:45" 가 "13:30–1" 로 잘린다. 잘린 시각은 없느니만 못하므로
        들어갈 만큼만 남긴다: 시작–종료 → 시작만 → (그래도 안 되면) 생략. */
  elRes.querySelectorAll('.blk .rng').forEach(el=>{
    if(el.scrollWidth > el.clientWidth+1){
      el.textContent = el.dataset.s;
      if(el.scrollWidth > el.clientWidth+1) el.textContent = '';
    }
  });
  /* 3) 4배 상한에 걸려 여전히 넘치는 이름만 좌우로 훑는다 */
  elRes.querySelectorAll('.blk .nm').forEach(el=>{
    const inner=el.firstElementChild;
    const over=inner.scrollWidth-el.clientWidth;
    if(over>1){
      el.classList.add('roll');
      el.style.setProperty('--shift', (-over-2)+'px');
    }
  });
}
function axisTicks(lo,hi,span){
  const step=span>420?120:span>240?60:30;
  let s=Math.ceil(lo/step)*step, out='';
  for(let t=s;t<=hi;t+=step){
    out+=`<span class="tick" style="left:${((t-lo)/span)*100}%">${fmt(t)}</span>`;
  }
  return out;
}

/* ── 실행 ── */
const $ = id => document.getElementById(id);
/* 식사 시간 입력칸은 켰을 때만 보인다 */
$('oMeal').onchange = e => $('mealRow').classList.toggle('on', e.target.checked);
/* 당일 즉흥으로 짤 때 시작 하한을 현재 시각으로 */
$('nowBtn').onclick = () => { const d=new Date(); $('oStart').value = pad(d.getHours())+':'+pad(d.getMinutes()); };

function readOptions(){
  const partial=$('oPartial').checked;
  const o={
    startMin: parseClock($('oStart').value),
    endMax:   parseClock($('oEnd').value),
    minGap:   parseInt($('oMinGap').value)||0,
    maxGap:   ($('oMaxGap').value.trim()==='')?null:(parseInt($('oMaxGap').value)||null),
    /* 매진 회차는 애초에 예약할 수 없으므로 선택지로 두지 않는다.
       "매진" 이 붙어 들어온 회차만 여기서 걸러지고, 나머지는 사용자가 빼고 넣는다. */
    excludeSoldout: true,
    minCount: partial?2:themesReady.length,
    meal: null
  };
  if($('oMeal').checked){
    const from=parseClock($('oMealFrom').value), to=parseClock($('oMealTo').value);
    const min=parseInt($('oMealMin').value)||0;
    if(from!=null && to!=null && min>0) o.meal={from,to,min};
  }
  return o;
}

let themesReady=[];
$('go').onclick=()=>{
  const note=$('runNote');
  /* 잠근 카드의 "자리" 는 실제로 진행되는 순서 기준이다.
     회차가 없는 카드는 애초에 일정에 안 들어가므로 걸러낸 뒤의 인덱스를 쓴다. */
  themesReady=themes.filter(t=>t.sessions.length&&t.dur>0)
                    .map((t,i)=>({name:t.name||('테마 '+(i+1)),dur:t.dur,sessions:t.sessions,
                                  lockPos: t.lock ? i : null}));
  if(themesReady.length<2){ note.textContent='회차가 있는 테마가 2개 이상 필요합니다.'; found=[]; renderResults(); elCount.textContent=''; return; }

  const o=readOptions();
  /* 최대 공백이 식사 공백보다 작으면 서로 모순이라 결과가 0이 된다 — 미리 알려준다 */
  if(o.meal && o.maxGap!=null && o.maxGap<o.meal.min){
    note.textContent=`최대 공백(${o.maxGap}분)이 식사 공백(${o.meal.min}분)보다 작아 조합이 나올 수 없습니다.`;
    found=[]; renderResults(); elCount.textContent=''; return;
  }
  const t0=performance.now();
  const {out,capped}=search(themesReady,o);
  found=out;
  const ms=Math.round(performance.now()-t0);
  tabCount=null; tabSet=null;      // 새로 계산하면 탭 선택을 초기화한다
  elCount.textContent=`${out.length.toLocaleString()}개 조합${capped?' (탐색 한도 도달)':''}`;
  note.textContent=`${ms}ms · 상위 ${Math.min(SHOW,currentList().length||out.length)}개 표시`;
  renderTabs();
  renderResults();
};

/* ── 공유: 링크(상태 직렬화) + 텍스트(카톡 등에 붙여넣기) ──
   서버가 없으므로 상태를 URL 해시에 담는다. raw 문자열만 있으면 회차는 다시 파싱되므로
   회차 배열까지 넣지 않는다 — 링크가 짧아지고 나중에 형식을 바꿔도 덜 깨진다. */
const b64e = str => btoa(Array.from(new TextEncoder().encode(str), c=>String.fromCharCode(c)).join(''))
                      .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d = str => new TextDecoder().decode(
  Uint8Array.from(atob(str.replace(/-/g,'+').replace(/_/g,'/')), ch=>ch.charCodeAt(0)));

function serialize(){
  return b64e(JSON.stringify({
    v:2,
    t: themes.map(t=>[t.name, t.dur, t.raw, t.lock?1:0]),
    o: [$('oStart').value, $('oEnd').value, $('oMinGap').value, $('oMaxGap').value,
        1, $('oPartial').checked?1:0,
        $('oMeal').checked?1:0, $('oMealFrom').value, $('oMealTo').value, $('oMealMin').value],
    k: sortKey
  }));
}
function restore(hash){
  const d=JSON.parse(b64d(hash));
  if(d.v!==1 && d.v!==2) throw new Error('알 수 없는 링크 형식');
  themes = d.t.map(([name,dur,raw,lock])=>{
    const th=blank(name); th.dur=dur; th.raw=raw||'';
    th.lock=!!lock;                 // v1 의 'first'/'last' 문자열도 참으로 읽혀 자리 고정이 된다
    th.sessions=parseSessions(th.raw); th.source=th.raw?'manual':'';
    return th;
  });
  const [a,b,c2,dd,so,pt,me,mf,mt,mm]=d.o;
  $('oStart').value=a; $('oEnd').value=b; $('oMinGap').value=c2; $('oMaxGap').value=dd;
  $('oPartial').checked=!!pt;   // so 슬롯은 옛 링크 호환용으로 남겨두고 쓰지 않는다
  $('oMeal').checked=!!me; $('mealRow').classList.toggle('on',!!me);
  $('oMealFrom').value=mf; $('oMealTo').value=mt; $('oMealMin').value=mm;
  if(d.k) sortKey=d.k;
}

async function copyText(text, note){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch{
    /* 클립보드 권한이 없거나 http 인 경우 — 선택 가능한 형태로 대체한다 */
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok=false;
    try{ ok=document.execCommand('copy'); }catch{}
    ta.remove();
    return ok;
  }
}
$('shareBtn').onclick = async ()=>{
  const note=$('runNote');
  /* 주소창을 건드리지 않는다. 예전엔 여기서 location.hash 를 바꿨는데,
     그러면 그 뒤로 새로고침할 때마다 그때의 상태가 되살아나 기본값을 덮어쓴다. */
  const url = location.origin + location.pathname + '#s=' + serialize();
  const ok = await copyText(url);
  if(ok){ note.textContent='링크를 복사했습니다.'; }
  else {
    location.hash = 's=' + serialize();   // 복사가 막힌 경우에만 주소창으로 대체
    note.textContent='복사가 막혀 주소창에 넣었습니다. 주소창 링크를 복사해 주세요.';
  }
};

/* 결과 한 건을 사람이 읽는 형태로 — 카톡·메모에 그대로 붙여넣는 용도 */
function resultToText(r){
  const dur = m => (m>=60 ? Math.floor(m/60)+'시간 '+(m%60?(m%60)+'분':'') : m+'분').trim();
  const head = `${r.count}연방 · ${fmt(r.start)} → ${fmt(r.end)} (${dur(r.end-r.start)}, 공백 ${r.total}분)`;
  const body = r.steps.map((s,i)=>{
    const line = `${fmt(s.start)}–${fmt(s.end)}  ${s.name} (${s.dur}분)`;
    const g = i<r.steps.length-1 ? r.steps[i+1].start - s.end : null;
    return g===null ? line : line + `\n     ↓ 공백 ${g}분`;
  }).join('\n');
  return head + '\n\n' + body;
}

/* ── init ── */
/* 공유 링크로 들어온 경우 상태를 되살린다. 형식이 깨졌으면 조용히 무시하고 빈 화면으로 시작한다 */
if(location.hash.startsWith('#s=')){
  try{
    restore(location.hash.slice(3));
    if(!themes.length) themes=seed();     // 빈 링크였다면 기본값을 지키는 편이 낫다
  }catch(err){
    console.warn('링크 복원 실패:', err.message);
    themes=seed();
  }
}
renderThemes(); renderSorts();
</script>
